  if(t.hasAttribute("data-checkout")){var co=root.querySelectorAll("[data-checkout]");ev("quiz_click_comprar_"+(t===co[0]?"1":"2"))}
  if(t.hasAttribute("data-faq"))ev("quiz_faq_abre");
  if(t.hasAttribute("data-back"))return back();
  if(t.hasAttribute("data-next")){if(!t.disabled)next();return}
  if(t.dataset.k){S[t.dataset.k]=t.dataset.v;render();return go(next)}
  if(t.dataset.m){var a=S[t.dataset.m],v=t.dataset.v,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);var y=document.getElementById("qb").scrollTop;render();document.getElementById("qb").scrollTop=y;return}
  if(t.dataset.st){var k=t.dataset.st,mx=+t.dataset.max;if(k==="desired")mx=S.weight-1;S[k]=Math.max(+t.dataset.min,Math.min(mx,S[k]+(+t.dataset.d)));if(k==="weight"&&S.desired>=S.weight)S.desired=S.weight-1;render();return}
  if(t.hasAttribute("data-faq")){t.parentNode.classList.toggle("on");return}
});
render();
})();
</script>
