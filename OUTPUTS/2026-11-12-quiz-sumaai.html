<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SumaAI — Tu plan de calorías</title>
<!-- ============================================================
     CONFIG — todo lo editable vive acá
     ============================================================ -->
<script>
window.CONFIG = {
  MARCA: "SumaAI",
  CLAIM: "Sacale una foto. SumaAI la suma.",

  /* ⚠️ PENDIENTES (confirmar con Santiago) */
  LINK_CHECKOUT: "/checkout",       // relativo: resuelve al checkout de la tienda donde se pegue
  PIXEL_ID: "",                     // vacío = no dispara nada
  precio: "14.990",                 // placeholder
  precioAntes: "49.990",            // placeholder
  cantCuotas: 3,
  cuota: "4.997",                   // 14990 / 3 redondeado hacia arriba
  SEGUNDOS_OFERTA: 0,               // 0 = la oferta se ve de una (sin VSL). Si se carga un VSL, poner los segundos.

  /* ⚠️ reemplazar por reseñas reales antes de poner plata */
  resenas: [
    { n: "Marcela F.", c: "Rosario",  t: "Comía igual que siempre y no entendía por qué no bajaba. Resulta que el desayuno 'sano' me comía medio día de calorías." },
    { n: "Diego P.",   c: "Córdoba",  t: "Lo único que hago es la foto del plato. En tres semanas bajé 4 kilos sin dejar el asado del domingo." },
    { n: "Vanina R.",  c: "La Plata", t: "Nunca pesé un alimento. Sé cuánto me queda para el día y con eso me arreglo." }
  ]
};
</script>
<style>
:root{
  --az:#1B4CD9;        /* acento de marca */
  --az-d:#0E2452;      /* azul tinta, títulos */
  --az-l:#E8EFFD;      /* azul lavado */
  --bg:#F2F6FD;
  --card:#fff;
  --tx:#15213B;
  --tx2:#5B6782;
  --line:#DDE5F4;
  --ok:#1F6B47;        /* verde = bien (nunca es el color de marca) */
  --rg:#C0392B;        /* rojo = riesgo */
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%;height:auto;display:block}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:440px;margin:0 auto;padding:0 16px 48px}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 8px}
.topin{display:flex;align-items:center;gap:10px;max-width:440px;margin:0 auto;padding:0 16px}
.back{width:34px;height:34px;flex:0 0 34px;border:0;background:#fff;border-radius:50%;
  box-shadow:0 1px 3px rgba(14,36,82,.12);color:var(--az-d);font-size:18px;line-height:1;cursor:pointer}
.back[hidden]{visibility:hidden;display:block!important}
.logo{font-weight:800;letter-spacing:-.02em;color:var(--az-d);font-size:1.08rem}
.logo i{color:var(--az);font-style:normal}
.prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px auto 0;max-width:440px}
.prog>i{display:block;height:100%;background:var(--az);border-radius:99px;transition:width .35s ease}
.pcount{font-size:.74rem;color:var(--tx2);text-align:right;max-width:440px;margin:6px auto 0;padding:0 16px}

/* ---- tipografía de paso ---- */
.q{font-size:1.5rem;line-height:1.26;font-weight:800;color:var(--az-d);letter-spacing:-.02em;margin:22px 0 6px}
.sub{color:var(--tx2);margin:0 0 20px;font-size:.96rem}
.hint{font-size:.8rem;color:var(--tx2);text-align:center;margin:14px 0 0}

/* ---- opciones ---- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:15px 14px;font-size:1rem;color:var(--tx);font-family:inherit;
  transition:border-color .15s,transform .05s}
.opt:active{transform:scale(.99)}
.opt:hover{border-color:#B9CBF2}
.opt .ic{flex:0 0 38px;height:38px;display:grid;place-items:center;background:var(--az-l);
  border-radius:11px;font-size:1.12rem}
.opt .tt{flex:1;font-weight:600}
.opt .tt small{display:block;font-weight:400;color:var(--tx2);font-size:.82rem;line-height:1.35}
.opt .ar{color:#9FB2D6;font-size:1.1rem}
.opt.sel{border-color:var(--az);background:#F7FAFF}
.opt .bx{flex:0 0 22px;height:22px;border:1.5px solid #C3D1EC;border-radius:6px;display:grid;place-items:center;
  color:#fff;font-size:.78rem}
.opt.sel .bx{background:var(--az);border-color:var(--az)}

/* ---- botón ---- */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;
  width:100%;border:0;cursor:pointer;font-family:inherit;
  background:var(--az);color:#fff;font-weight:800;font-size:1.03rem;
  padding:16px 18px;border-radius:14px;margin-top:18px;text-decoration:none;
  box-shadow:0 6px 16px rgba(27,76,217,.26)}
.btn[disabled]{background:#C3D1EC;box-shadow:none;cursor:default}
.btn.g{background:var(--ok);box-shadow:0 6px 16px rgba(31,107,71,.26)}

/* ---- placas ---- */
.placa{background:var(--card);border-radius:var(--r);padding:22px 18px;border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(14,36,82,.05);margin-top:18px}
.placa h3{margin:0 0 8px;font-size:1.22rem;color:var(--az-d);letter-spacing:-.01em}
.placa p{margin:0 0 12px;color:var(--tx2)}
.placa p:last-child{margin-bottom:0}
.chip{display:inline-block;background:var(--az-l);color:var(--az-d);font-size:.78rem;font-weight:700;
  padding:5px 10px;border-radius:99px;margin:0 6px 6px 0}
.bars{display:flex;align-items:flex-end;gap:10px;height:112px;margin:18px 0 6px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.bars b{display:block;width:100%;background:linear-gradient(180deg,#5B8BF2,var(--az));border-radius:8px 8px 3px 3px}
.bars span{font-size:.72rem;color:var(--tx2)}

/* ---- maqueta de celular (HTML/CSS, sin imágenes) ---- */
.fono{width:186px;margin:16px auto 4px;background:#0E2452;border-radius:26px;padding:8px;
  box-shadow:0 14px 30px rgba(14,36,82,.26)}
.fono .scr{background:#F7FAFF;border-radius:20px;overflow:hidden}
.fono .nb{height:16px;display:grid;place-items:center}
.fono .nb i{display:block;width:46px;height:4px;background:#C3D1EC;border-radius:99px}
.fono .plate{height:70px;background:linear-gradient(135deg,#FFE2B8,#FFC487);display:grid;place-items:center;font-size:1.9rem}
.fono .bd{padding:9px 10px 11px}
.fono .kcal{font-size:1.5rem;font-weight:800;color:var(--az-d);line-height:1.1}
.fono .kcal small{display:block;font-size:.58rem;font-weight:600;color:var(--tx2);letter-spacing:.04em}
.fono .ring{height:6px;background:var(--line);border-radius:99px;margin:8px 0 9px;overflow:hidden}
.fono .ring i{display:block;height:100%;width:64%;background:var(--az);border-radius:99px}
.fono .row{display:flex;justify-content:space-between;font-size:.6rem;color:var(--tx2);margin-top:4px}
.fono .row b{color:var(--az-d)}

/* ---- slider ---- */
.sval{text-align:center;margin:26px 0 6px}
.sval b{font-size:3.1rem;font-weight:800;color:var(--az-d);letter-spacing:-.03em;line-height:1}
.sval span{font-size:1.05rem;color:var(--tx2);font-weight:700;margin-left:4px}
.rule{position:relative;height:30px;margin:2px 0 10px}
.rule i{position:absolute;bottom:0;width:1px;background:#C3D1EC}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:7px;background:var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;
  background:#fff;border:3px solid var(--az);border-radius:50%;box-shadow:0 2px 8px rgba(14,36,82,.22);cursor:pointer}
input[type=range]::-moz-range-track{height:7px;background:var(--line);border-radius:99px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:#fff;border:3px solid var(--az);border-radius:50%;cursor:pointer}
.ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--tx2)}

/* ---- alerta ---- */
.warn{display:flex;gap:10px;background:#FDF3F1;border:1px solid #F2CFC9;border-radius:12px;
  padding:12px 13px;margin-top:14px;font-size:.88rem;color:#8E2E22}
.warn b{color:var(--rg)}

/* ---- carga ---- */
.load{padding:40px 0 10px}
.load .big{font-size:1.32rem;font-weight:800;color:var(--az-d);text-align:center;margin-bottom:4px}
.load .pct{text-align:center;color:var(--tx2);font-size:.9rem;margin-bottom:22px}
.lbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.lbar i{display:block;height:100%;width:0;background:var(--az);border-radius:99px;transition:width .2s linear}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--tx2)}
.lrow:last-child{border:0}
.lrow.on{color:var(--tx);font-weight:600}
.lrow .tick{flex:0 0 22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;
  color:#fff;font-size:.72rem}
.lrow.on .tick{background:var(--ok)}

/* ---- resultado ---- */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:18px;margin-top:14px;
  box-shadow:0 2px 10px rgba(14,36,82,.05)}
.kpi{display:flex;gap:10px;margin-top:14px}
.kpi>div{flex:1;background:var(--az-l);border-radius:13px;padding:13px 11px;text-align:center}
.kpi b{display:block;font-size:1.5rem;color:var(--az-d);letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:.72rem;color:var(--tx2);font-weight:600}
.imc{margin-top:18px}
.imc .tr{height:9px;border-radius:99px;background:linear-gradient(90deg,#4F86F0,var(--ok),#E8A13A,var(--rg));position:relative}
.imc .dot{position:absolute;top:-5px;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--az-d);
  transform:translateX(-50%);box-shadow:0 2px 6px rgba(14,36,82,.25)}
.imc .lb{display:flex;justify-content:space-between;font-size:.68rem;color:var(--tx2);margin-top:7px}
.proj{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:8px}
.proj>div{flex:1;text-align:center}
.proj .pb{background:var(--az-l);border-radius:9px 9px 3px 3px;border-bottom:3px solid var(--az)}
.proj .pb.meta{background:#E4F3EB;border-bottom-color:var(--ok)}
.proj em{display:block;font-style:normal;font-size:.7rem;color:var(--tx2);margin-top:6px}
.proj strong{display:block;font-size:.86rem;color:var(--az-d)}
.logros{list-style:none;margin:14px 0 0;padding:0}
.logros li{display:flex;gap:9px;padding:8px 0;font-size:.93rem;border-top:1px solid var(--line)}
.logros li b{color:var(--ok)}

/* ---- oferta ---- */
#oferta[hidden]{display:none}
.cd{background:var(--az-d);color:#fff;border-radius:13px;padding:12px;text-align:center;margin-top:16px}
.cd span{font-size:.78rem;opacity:.82;display:block}
.cd b{font-size:1.52rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.cuotas{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center;margin-top:12px}
.cuotas b{color:var(--az-d);font-size:1.06rem}
.cuotas span{display:block;font-size:.8rem;color:var(--tx2)}
.aviso{font-size:.84rem;color:var(--tx2);text-align:center;margin-top:12px}
.oferta-box{background:#fff;border:1.5px solid var(--az);border-radius:18px;padding:20px 17px;margin-top:22px;position:relative;
  box-shadow:0 8px 24px rgba(14,36,82,.08)}
.oferta-box .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--az);color:#fff;
  font-size:.72rem;font-weight:800;letter-spacing:.06em;padding:6px 13px;border-radius:99px;white-space:nowrap}
.oferta-box h3{margin:8px 0 2px;font-size:1.44rem;color:var(--az-d);letter-spacing:-.02em;text-align:center}
.oferta-box .mec{text-align:center;font-size:.72rem;letter-spacing:.09em;color:var(--tx2);text-transform:uppercase;margin-bottom:14px}
.pr{text-align:center;margin:14px 0 4px}
.pr .old{color:var(--tx2);text-decoration:line-through;font-size:1rem}
.pr .sav{display:inline-block;background:#E4F3EB;color:var(--ok);font-weight:800;font-size:.78rem;padding:4px 9px;border-radius:99px;margin-left:7px}
.pr .now{display:block;font-size:2.7rem;font-weight:800;color:var(--az-d);letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.pr .now small{font-size:.9rem;font-weight:600;color:var(--tx2);letter-spacing:0}
.lleva{background:#F7FAFF;border-radius:13px;padding:15px;margin-top:16px}
.lleva h4{margin:0 0 9px;font-size:.98rem;color:var(--az-d)}
.lleva ul{list-style:none;margin:0;padding:0}
.lleva li{display:flex;gap:9px;padding:6px 0;font-size:.93rem}
.lleva li b{color:var(--ok)}
.vida{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:11px;text-align:center;font-size:.92rem}
.vida b{color:var(--az-d)}
.garantia{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:16px}
.garantia .sello{flex:0 0 58px}
.garantia p{margin:0;font-size:.88rem;color:var(--tx2)}
.garantia p b{color:var(--az-d);display:block;font-size:.96rem}
.rese{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:11px}
.rese .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rese .av{width:38px;height:38px;border-radius:50%;background:var(--az-l);color:var(--az-d);display:grid;place-items:center;font-weight:800}
.rese .nm{font-weight:700;font-size:.92rem;color:var(--az-d);line-height:1.2}
.rese .nm span{display:block;font-weight:400;font-size:.76rem;color:var(--tx2)}
.rese p{margin:0;font-size:.91rem;color:var(--tx)}
.micro{text-align:center;font-size:.78rem;color:var(--tx2);margin-top:12px}
.faq{margin-top:22px}
.faq h4{font-size:1.1rem;color:var(--az-d);margin:0 0 10px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.faq summary{font-weight:700;color:var(--az-d);cursor:pointer;font-size:.94rem;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:9px 0 0;font-size:.9rem;color:var(--tx2)}
.vsl-frame{margin-top:4px;border-radius:14px;overflow:hidden;background:#000}
.vsl-frame>div{width:100%}

/* ---- notificaciones ---- */
#noti{position:fixed;left:12px;bottom:14px;z-index:60;max-width:270px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;display:flex;gap:9px;align-items:center;
  box-shadow:0 6px 18px rgba(14,36,82,.14);opacity:0;transform:translateY(8px);
  transition:opacity .3s,transform .3s;pointer-events:none}
#noti.on{opacity:1;transform:translateY(0)}
#noti .av{flex:0 0 28px;height:28px;border-radius:50%;background:var(--az-l);color:var(--az-d);
  display:grid;place-items:center;font-weight:800;font-size:.8rem}
#noti .tx{font-size:.78rem;line-height:1.35;color:var(--tx)}
#noti .tx em{font-style:normal;color:var(--tx2);display:block;font-size:.72rem}
#noti .tx em b{color:var(--rg)}
</style>
</head>
<body>

<div class="top">
  <div class="topin">
    <button class="back" id="back" data-back aria-label="Volver">‹</button>
    <div class="logo">Suma<i>AI</i></div>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="pcount" id="pcount"></div>
</div>

<div class="wrap"><div id="app"></div></div>

<div id="noti"><div class="av" id="nav">M</div><div class="tx" id="ntx"></div></div>

<!-- El embed del VSL (Panda) va acá adentro. Vacío = la oferta se muestra de una. -->
<template id="vsl-template"></template>

<script>
(function(){
  "use strict";
  var C = window.CONFIG, B = C.MARCA;

  /* ---------- estado ---------- */
  var S = {
    genero:"", edad:"", objetivo:"", intento:"", reto:"", comidas:"",
    cuenta:[], mov:"", altura:168, peso:82, pesoObj:72, ritmo:"", salud:[]
  };

  /* ---------- helpers ---------- */
  function g(){ return S.genero==="h" ? "o" : "a"; }                 // token {{o}}
  function T(s){ return String(s).replace(/\{\{o\}\}/g, g()).replace(/\{\{B\}\}/g, B); }
  function num(n){ return Math.round(n).toLocaleString("es-AR"); }
  function fecha(d){ return d.toLocaleDateString("es-AR",{day:"numeric",month:"short"}).replace(".",""); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }

  /* ---------- cálculo real (Mifflin-St Jeor) ---------- */
  function calc(){
    var edadN = {"18-24":21,"25-34":29,"35-44":39,"45+":50}[S.edad] || 35;
    var tmb = S.genero==="h"
      ? 10*S.peso + 6.25*S.altura - 5*edadN + 5
      : 10*S.peso + 6.25*S.altura - 5*edadN - 161;
    var fa  = {bajo:1.2, medio:1.375, alto:1.55}[S.mov] || 1.2;
    var tdee = tmb*fa;
    var def  = {relajado:300, equilibrado:500, ambicioso:750}[S.ritmo] || 500;
    var meta = Math.max(1200, tdee - def);      // piso de seguridad
    var defReal = Math.max(150, tdee - meta);   // el déficit que de verdad queda después del piso
    var kilos = Math.max(1, S.peso - S.pesoObj);
    var kgSem = defReal*7/7700;                 // 7.700 kcal ≈ 1 kg
    var sem   = Math.max(1, Math.ceil(kilos/kgSem));
    var hoy = new Date();
    var fin = new Date(hoy.getTime() + sem*7*864e5);
    var med = new Date(hoy.getTime() + Math.round(sem/2)*7*864e5);
    var imc = S.peso / Math.pow(S.altura/100,2);
    return {
      tmb:tmb, tdee:tdee, def:defReal, meta:meta, piso:(tdee-def) < 1200, kilos:kilos, kgSem:kgSem, sem:sem,
      hoy:hoy, med:med, fin:fin, imc:imc,
      pesoMed: S.peso - kilos/2,
      imcTxt: imc<18.5?"Bajo peso": imc<25?"Saludable": imc<30?"Sobrepeso":"Obesidad",
      imcPos: Math.min(97, Math.max(3, (imc-16)/(40-16)*100))
    };
  }

  /* ---------- los pasos ---------- */
  var P = [
    /* 1 */ { t:"opt", k:"genero", q:"¿Cuál es tu plan de calorías?",
      sub:"Un minuto y medio de preguntas y te decimos exactamente cuántas calorías tenés que comer por día.",
      o:[{v:"h",ic:"👨",l:"Soy hombre"},{v:"m",ic:"👩",l:"Soy mujer"}] },

    /* 2 */ { t:"opt", k:"edad", q:"¿Cuántos años tenés?",
      sub:"El metabolismo cambia con la edad: con esto calculamos tu número real.",
      o:[{v:"18-24",ic:"🙂",l:"18 a 24"},{v:"25-34",ic:"😀",l:"25 a 34"},{v:"35-44",ic:"😎",l:"35 a 44"},{v:"45+",ic:"🧓",l:"45 o más"}] },

    /* 3 */ { t:"opt", k:"objetivo", q:"¿Qué querés lograr?",
      sub:"Todo lo que viene después se arma con esta respuesta.",
      o:[
        {v:"peso",  ic:"⚖️",l:"Bajar de peso",  s:"Perder grasa sin dejar de comer lo que me gusta"},
        {v:"salud", ic:"🫀",l:"Estar más san{{o}}", s:"Que los análisis den bien"},
        {v:"verme", ic:"💪",l:"Verme mejor",    s:"Que se note en la ropa y en las fotos"},
        {v:"energia",ic:"⚡",l:"Tener más energía", s:"Dejar de caerme a las 4 de la tarde"}
      ] },

    /* 4 */ { t:"placa", q:"Tenemos buenas noticias", f:"promesa" },

    /* 5 */ { t:"opt", k:"intento", q:"¿Ya intentaste contar lo que comés?",
      o:[
        {v:"nunca", ic:"🆕",l:"Nunca lo hice"},
        {v:"deje",  ic:"😮‍💨",l:"Lo intenté y lo dejé"},
        {v:"ahora", ic:"📓",l:"Estoy intentando ahora"}
      ] },

    /* 6 */ { t:"opt", k:"reto", q:"¿Qué fue lo que te hizo abandonar?",
      sub:"Decilo tal cual: es el punto que vamos a resolver.",
      o:[
        {v:"complicado",ic:"🧮",l:"Era un quilombo anotar todo"},
        {v:"tiempo",    ic:"⏰",l:"No tenía tiempo"},
        {v:"resultados",ic:"📉",l:"No veía resultados"},
        {v:"estres",    ic:"😣",l:"Me estresaba estar midiendo"},
        {v:"motivacion",ic:"🔥",l:"Perdí la motivación"}
      ] },

    /* 7 */ { t:"placa", q:"Con {{B}} no anotás nada", f:"mecanismo" },

  function clearTimers(){ timers.forEach(function(t){ clearInterval(t); clearTimeout(t); }); timers = []; }

  function visibles(step){
    if(step.t!=="multi") return step.o;
    return step.o.filter(function(o){ return !(o.solo_m && S.genero!=="m"); });
  }

  /* ---------- render ---------- */
  function render(){
    clearTimers();
    var s = P[page];
    document.getElementById("pbar").style.width = Math.round((page)/(P.length-1)*100)+"%";
    var esPregunta = ["opt","multi","placa","slider"].indexOf(s.t) >= 0;
    document.getElementById("pcount").textContent = esPregunta ? "Paso "+(page+1)+" de "+QN : "";
    // sin flecha de volver en la portada, en la carga ni en la oferta
    back.hidden = (page===0 || s.t==="load" || s.t==="oferta");
    window.scrollTo(0,0);
    ({opt:rOpt, multi:rMulti, placa:rPlaca, slider:rSlider, load:rLoad, res:rRes, oferta:rOferta})[s.t](s);
  }
  function next(){ if(page < P.length-1){ page++; render(); } }
  function prev(){ if(page > 0){ page--; render(); } }
  back.addEventListener("click", prev);

  function head(s){
    return '<h1 class="q">'+T(s.q)+'</h1>'+(s.sub?'<p class="sub">'+T(s.sub)+'</p>':'');
  }

  /* --- opción única: avanza sola --- */
  function rOpt(s){
    app.innerHTML = head(s) + '<div class="opts">' + s.o.map(function(o){
      return '<button class="opt" type="button" data-v="'+o.v+'">'+
        '<span class="ic">'+o.ic+'</span><span class="tt">'+T(o.l)+
        (o.s?'<small>'+T(o.s)+'</small>':'')+'</span><span class="ar">›</span></button>';
    }).join("") + '</div>';
    app.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){ S[s.k] = b.dataset.v; next(); });
    });
  }

  /* --- selección múltiple: Continuar apagado hasta elegir --- */
  function rMulti(s){
    var ops = visibles(s);
    app.innerHTML = head(s) + '<div class="opts">' + ops.map(function(o){
      return '<button class="opt" type="button" data-v="'+o.v+'"'+(o.solo?' data-solo="1"':'')+'>'+
        '<span class="ic">'+o.ic+'</span><span class="tt">'+T(o.l)+'</span><span class="bx">✓</span></button>';
    }).join("") + '</div><button class="btn" id="next" data-next disabled>Continuar</button>';
    var btn = app.querySelector("#next");
    function sync(){
      app.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel", S[s.k].indexOf(b.dataset.v)>=0); });
      btn.disabled = S[s.k].length===0;
    }
    app.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var v = b.dataset.v, i = S[s.k].indexOf(v);
        if(b.dataset.solo){ S[s.k] = i>=0 ? [] : [v]; }
        else {
          S[s.k] = S[s.k].filter(function(x){ return !ops.some(function(o){ return o.solo && o.v===x; }); });
          i = S[s.k].indexOf(v);
          if(i>=0) S[s.k].splice(i,1); else S[s.k].push(v);
        }
        sync();
      });
    });
    btn.addEventListener("click", function(){ if(!btn.disabled) next(); });
    sync();
  }

  /* --- sliders con regla --- */
  function rSlider(s){
    var val = S[s.k];
    var ticks = "";
    for(var i=0;i<=40;i++){
      var alto = i%5===0 ? 16 : 9;
      ticks += '<i style="left:'+(i/40*100)+'%;height:'+alto+'px"></i>';
    }
    app.innerHTML = head(s) +
      '<div class="sval"><b id="sv">'+val+'</b><span>'+s.u+'</span></div>'+
      '<div class="rule">'+ticks+'</div>'+
      '<input type="range" id="sr" min="'+s.min+'" max="'+s.max+'" value="'+val+'" step="1">'+
      '<div class="ends"><span>'+s.min+' '+s.u+'</span><span>'+s.max+' '+s.u+'</span></div>'+
      '<div id="sw"></div>'+
      '<button class="btn" id="next" data-next>Continuar</button>';
    var sr = app.querySelector("#sr"), sv = app.querySelector("#sv"), sw = app.querySelector("#sw");
    function aviso(){
      sw.innerHTML = "";
      if(s.f==="obj" && S.peso - S[s.k] > 25){
        sw.innerHTML = '<div class="warn"><span>⚠️</span><div><b>Es un objetivo grande.</b> Lo vamos a dividir en etapas de 5 kg para que no abandones en la segunda semana.</div></div>';
      }

    sr.addEventListener("input", function(){
      S[s.k] = +sr.value; sv.textContent = sr.value;
      if(s.k==="peso" && S.pesoObj > S.peso) S.pesoObj = S.peso;
      aviso();
    });
    aviso();
    app.querySelector("#next").addEventListener("click", next);

    timers.push(iv);

                 ["Gustavo A.","Mendoza"],["Lorena P.","Mar del Plata"],["Sergio M.","Salta"]];
    var cupos = 8, i = 0;

    var iv2 = setInterval(function(){
      var p = gente[i % gente.length]; i++;

  /* --- un solo lugar engancha todos los CTAs --- */
  function ligarCTAs(){
    var url = C.LINK_CHECKOUT || "/checkout";
    var qs = location.search.replace(/^\?/,"");
    if(qs) url += (url.indexOf("?")>=0 ? "&" : "?") + qs;
    document.querySelectorAll("#oferta a.btn, #oferta button.btn, #oferta .js-cta").forEach(function(el){
      if(el.dataset.cta) return;
      el.dataset.cta = "1";
      if(el.tagName === "A"){ el.setAttribute("href", url); el.setAttribute("rel","noopener"); }
      else { el.style.cursor = "pointer"; }
      el.addEventListener("click", function(){
        if(window.fbq) fbq("track","AddToCart");
        if(el.tagName !== "A") location.href = url;
      });
    });
  }

  /* pixel (solo si hay ID) */
  if(C.PIXEL_ID){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', C.PIXEL_ID); fbq('track','PageView');
  }

  ligarCTAs();   // también en el arranque
  render();
})();
</script>
