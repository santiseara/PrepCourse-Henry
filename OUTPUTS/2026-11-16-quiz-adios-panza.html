<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Adiós Panza · Silvia Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,700;1,800&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
img{max-width:100%}
/* Layout: columna única de 520px tipo app, header fijo con barra de progreso, CTA fijo abajo en diagnóstico y venta. Look único de marca (rosa + ciruela), sin modo oscuro. */
:root{
  --plum:#4a1530; --plum-2:#6e2348; --rasp:#b8336a; --rasp-dark:#962653;
  --pink:#f2b6d2; --pink-soft:#fcebf3; --paper:#fff8fb; --ink:#2a0f1d; --muted:#7c5a6b;
  --line:#efd3e1; --ok:#2f9a5c; --white:#ffffff;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --script:"Playfair Display",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:520px;margin:0 auto;padding-inline:18px;padding-block:0 140px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:12px 10px}
.brand{display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.back{width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:24px;border-radius:50%}
.back.off{visibility:hidden;pointer-events:none}
.brand>.back{grid-column:1}.brand>.logo{grid-column:2}.brand>span{grid-column:3}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.avatar{width:42px;height:42px;object-fit:cover;border-radius:50%;background:var(--pink);border:2px solid var(--plum);display:grid;place-items:center;font-family:var(--script);font-style:italic;font-weight:800;color:var(--plum);font-size:22px}
.logo b{display:block;font-weight:800;letter-spacing:.18em;font-size:14px;color:var(--plum)}
.logo small{display:block;font-weight:700;letter-spacing:.32em;font-size:11px;color:var(--rasp)}
.bar{height:7px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--rasp);border-radius:9px;transition:width .4s ease}

/* screens */
.screen{padding-top:18px;animation:in .35s ease both}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.bar i{transition:none}}
h1,h2{margin:0;text-align:center;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.05;color:var(--plum);letter-spacing:.01em;text-transform:uppercase}
h1 em,h2 em{font-style:normal;color:var(--rasp)}
h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--plum);text-transform:uppercase}
.script{font-family:var(--script);font-style:italic;font-weight:800;color:var(--rasp);text-transform:none;letter-spacing:0}
.sub{text-align:center;color:var(--muted);margin:12px auto 0;max-width:42ch}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 10px}
.kicker{text-align:center;font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--rasp);text-transform:uppercase;margin-bottom:8px}

/* options */
#app .opts{display:flex;flex-direction:column;gap:12px;margin-top:8px}
#app .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--white);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
#app .opt:hover{border-color:var(--pink)}
#app .opt:active{transform:scale(.99)}
#app .opt.sel{border-color:var(--rasp);background:var(--pink-soft)}
#app .opt .em{font-size:26px;width:32px;text-align:center;flex:none}
#app .opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);flex:none;display:grid;place-items:center}
#app .opt.sel .radio{border-color:var(--rasp)}
#app .opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rasp)}
#app .opt .txt{min-width:0}
#app .opt .t{font-weight:700;display:block;line-height:1.25}
#app .opt .d{color:var(--muted);font-size:15px;display:block;margin-top:2px}
#app .opt.fig{padding:0;overflow:hidden;align-items:stretch}
#app .opt.fig .pic{width:96px;flex:none;background:var(--pink-soft);display:grid;place-items:center;border-right:2px solid var(--line)}
#app .opt.fig .pic svg{width:56px;height:84px}
#app .opt.fig .body{display:flex;align-items:center;gap:14px;padding:14px 16px}

/* buttons */
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--rasp);color:var(--white);font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase;padding:18px 16px;cursor:pointer;text-align:center;text-decoration:none;line-height:1.15;box-shadow:0 6px 0 var(--rasp-dark)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
#app .opt.multi .radio{border-radius:6px}
#app .opt.multi.sel .radio::after{content:"✓";width:auto;height:auto;background:none;color:var(--rasp);font-weight:800;font-size:14px;line-height:1}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 var(--rasp-dark)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.sticky .in{max-width:520px;margin:0 auto}
.sticky small{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.mt{margin-top:22px}

/* cards & blocks */
.card{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:18px 18px}
.card h3{margin:0 0 6px;font-size:18px;color:var(--rasp);font-weight:800}
.card p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.card.hot{background:var(--plum);border-color:var(--plum);color:var(--pink-soft)}
.card.hot h3{color:var(--pink)}
.card.sum{background:var(--pink-soft);border-color:var(--pink)}
.card.sum b{color:var(--plum)}

/* social proof */
.review{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.review .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.review .n{font-weight:800}
.review .v{font-size:13px;color:var(--rasp);font-weight:700}
.stars{color:var(--rasp);letter-spacing:2px;font-size:15px}
.review p{margin:6px 0 0}
mark{background:var(--pink);color:var(--ink);padding:0 3px;border-radius:4px}
.ph{border:2px dashed var(--rasp);border-radius:14px;background:var(--pink-soft);color:var(--rasp);display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;padding:10px;letter-spacing:.04em}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba .ph{aspect-ratio:3/4;max-width:100%}

/* loading */
.ring{width:150px;height:150px;margin:26px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:40px;color:var(--plum);font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;color:var(--muted);transition:color .3s}
.checks li .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:var(--white)}
.checks li.done{color:var(--ink)}
.checks li.done .c{background:var(--ok);border-color:var(--ok)}
.count{text-align:center;margin-top:18px;font-weight:700;color:var(--plum)}

/* projection bars */
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.bcol{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bcol .pct{font-family:var(--display);font-size:24px;color:var(--rasp)}
.bcol .tube{width:44px;height:140px;border-radius:12px;background:var(--pink-soft);display:flex;align-items:flex-end;overflow:hidden}
.bcol .tube i{display:block;width:100%;background:var(--rasp);border-radius:12px;height:0;transition:height 1s ease}
.bcol b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--plum)}
.bcol small{color:var(--muted);font-size:13px;line-height:1.3}

/* chart */
.chart{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.chart h3{text-align:center;margin:0 0 8px;color:var(--plum);font-size:18px}
.chart svg{width:100%;height:auto;display:block}

/* name input */
.field{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--line);font:inherit;background:var(--white);color:var(--ink)}
.field:focus{border-color:var(--rasp);outline:none}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* plan generated */
.hero-ph{aspect-ratio:4/5;max-width:100%;margin-top:18px;border-radius:22px;background:linear-gradient(160deg,var(--pink) 0%,var(--plum-2) 100%);display:grid;place-items:center;color:var(--white);text-align:center;padding:20px}
.hero-ph .big{font-family:var(--script);font-style:italic;font-weight:800;font-size:64px;line-height:1}
.hero-ph small{display:block;margin-top:10px;font-weight:700;letter-spacing:.12em;font-size:12px;opacity:.9}
.hero-img{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;margin-top:18px;border-radius:22px;border:3px solid var(--pink)}
.auth{text-align:center;margin-top:16px;color:var(--muted)}
.auth b{color:var(--ink)}

/* sales */
.topbanner{background:var(--plum);color:var(--pink-soft);text-align:center;font-weight:700;letter-spacing:.1em;font-size:12.5px;padding:10px 12px;border-radius:12px;text-transform:uppercase;margin-top:16px}
.chat{background:var(--plum);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{background:#5e2140;color:var(--pink-soft);border-radius:14px 14px 14px 4px;padding:10px 14px;max-width:85%}
.bub .who{color:var(--pink);font-weight:700;font-size:13px;display:block}
.bub .tm{display:block;text-align:right;font-size:11px;opacity:.6}
.chat .ph{background:transparent;color:var(--pink);border-color:var(--pink)}
.list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start}
.list li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--white);display:grid;place-items:center;font-weight:800;font-size:14px;margin-top:1px}
.list li b{color:var(--plum)}
.app{background:var(--plum);border-radius:22px;padding:22px 18px;color:var(--pink-soft)}
.app .stamp{display:inline-block;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:34px;line-height:1.05;padding:4px 10px;text-transform:uppercase}
.app p{margin:12px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pills span{border:1.5px solid var(--pink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.acc{border-top:1.5px solid var(--line)}
.acc details{border-bottom:1.5px solid var(--line)}
.acc summary{cursor:pointer;padding:16px 4px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.acc summary::after{content:"+";color:var(--rasp);font-size:22px;line-height:1}
.acc details[open] summary::after{content:"–"}
.acc .ac{padding:0 4px 16px;color:var(--ink)}
.acc .ac p{margin:0 0 10px}
.bonus{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bon{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.bon .bt{font-weight:800;color:var(--plum)}
.bon p{margin:4px 0 6px;color:var(--muted);font-size:15px}
.bon .pr s{color:var(--muted)}
.bon .pr b{color:var(--rasp);margin-left:6px;font-size:14px;letter-spacing:.05em}
.warn{border:2px solid var(--rasp);background:var(--pink-soft);color:var(--rasp);border-radius:14px;padding:12px;text-align:center;font-weight:800}
.price{border:2.5px solid var(--rasp);border-radius:20px;padding:22px 16px;text-align:center;background:var(--white)}
.price .from{color:var(--muted);font-weight:700}
.price .from s{color:var(--muted)}
.price .now{font-family:var(--display);font-size:54px;color:var(--rasp);line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.price .per{color:var(--muted);margin-top:6px}
.badge{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;margin-top:10px}
.timer{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:18px}
.timer span{background:var(--rasp);color:var(--white);font-family:var(--display);font-size:40px;border-radius:12px;padding:6px 16px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.timer i{font-style:normal;font-family:var(--display);font-size:32px;color:var(--rasp)}
.tnote{text-align:center;font-weight:700;color:var(--plum);margin-top:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .card{padding:14px;text-align:center}
.duo .card b{display:block;color:var(--plum)}
.duo .card small{color:var(--muted);font-size:14px}
.live{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px}
.live span{background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
.live .up{color:var(--rasp);font-weight:800;border-color:var(--pink)}
.mp{background:var(--rasp-dark);color:var(--white);text-align:center;font-weight:700;padding:10px;border-radius:12px}
.sec{margin-top:34px}
.sec > h2{margin-bottom:6px}
.bafig{position:relative;margin:0;border-radius:18px;overflow:hidden;border:3px solid var(--pink);background:var(--white)}
.bafig img{display:block;width:100%;max-width:100%}
.bafig .tag{position:absolute;top:10px;background:var(--plum);color:var(--white);font-weight:800;font-size:12px;letter-spacing:.12em;padding:4px 10px;border-radius:999px}
.bafig .tag.l{left:10px}.bafig .tag.r{left:calc(50% + 10px);background:var(--rasp)}
.bafig figcaption{text-align:center;font-size:14px;color:var(--muted);padding:8px}
.wa{display:block;width:100%;max-width:100%;border-radius:16px;border:1.5px solid var(--line)}
.appimg{display:block;width:100%;max-width:100%;border-radius:22px}
.shots .wm{flex:0 0 82%;max-width:82%;position:relative;scroll-snap-align:center}
.shots .wm img{width:100%;max-width:100%;display:block}
.wmt{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:Georgia,serif;font-size:15px;color:#fff;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap;overflow:hidden}
.wmt u{text-decoration-thickness:1px;text-underline-offset:3px;margin:0 4px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;align-items:center}
.shots img{flex:0 0 82%;max-width:82%;scroll-snap-align:center;border-radius:16px;border:1.5px solid var(--line)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* mensajes de alumnas en HTML */
.chat{background:#fff;border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px 6px;box-shadow:0 1px 2px rgba(0,0,0,.06);text-align:left}
.chat b{display:block;color:#1f8a5b;font-size:14px}
.chat p{margin:2px 0 0;font-size:15px;line-height:1.45;color:#222}
.chat small{display:block;text-align:right;font-size:11px;color:#8a8a8a}
.shots .chat{flex:0 0 82%;max-width:82%;scroll-snap-align:center}
/* maqueta de la app */
.appmock{background:linear-gradient(160deg,var(--plum),var(--plum-2));border-radius:22px;padding:22px 20px 0;color:#fff;overflow:hidden}
.am-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.am-badge{background:var(--pink);color:var(--plum);font-weight:800;font-size:10px;letter-spacing:.14em;padding:4px 10px;border-radius:999px}
.am-k{font-size:10px;letter-spacing:.14em;color:var(--pink);font-weight:700}
.am-h{font-family:var(--display);font-size:40px;line-height:1.12;margin:18px 0 0}
.am-h span{background:#111;padding:0 8px}
.am-p{font-size:14px;margin:12px 0 0;color:var(--pink-soft)}
.am-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.am-chips span{border:1px solid rgba(255,255,255,.4);border-radius:999px;font-size:11px;padding:4px 10px}
.am-phone{width:72%;margin:22px auto 0;background:#111;border-radius:30px 30px 0 0;padding:10px 10px 0}
.am-scr{background:var(--pink-soft);border-radius:22px 22px 0 0;padding:16px 14px 18px;color:var(--ink)}
.am-scr>small{font-size:9px;letter-spacing:.14em;color:var(--rasp);font-weight:800}
.am-scr h4{font-family:var(--script);font-style:italic;font-size:24px;margin:4px 0 0;color:var(--plum)}
.am-scr>p{font-size:12px;margin:2px 0 10px;color:var(--muted)}
.am-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;margin-top:8px}
.am-row i{font-style:normal;font-size:18px}
.am-row div{flex:1}.am-row small{display:block;font-size:9px;letter-spacing:.12em;color:var(--rasp);font-weight:800}
.am-row b{font-size:13px}.am-row em{font-style:normal;color:var(--muted);font-size:18px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">

const $ = s=>document.querySelector(s);
const app = $("#app");
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm = ()=> name ? esc(name) : "";
function sticky(label,fn,note,href){
  const st=$("#sticky");
  if(!label){st.hidden=true;return}
  st.hidden=false; $("#stickyNote").textContent=note||"";
  const b=$("#stickyBtn"), l=$("#stickyLink");
  if(href){ b.hidden=true; l.hidden=false; l.href=href; l.textContent=label; }
  else { l.hidden=true; b.hidden=false; b.textContent=label; b.onclick=fn; }
}
function go(n){ hist.push(i); i=n; render(); window.scrollTo({top:0}); }
function next(){ go(i+1); }
$("#back").onclick=()=>{ if(hist.length){ i=hist.pop(); render(); window.scrollTo({top:0}); } };

let timers=[];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t)}); timers=[]; }

function render(){
  clearTimers();
  const s=S[i];
  $("#back").classList.toggle("off", i===0 || s.type==="loading");
  $("#barWrap").hidden = s.type==="sales";
  $("#bar").style.width = Math.min(100, Math.round(i/QUIZ_LEN*100))+"%";
  sticky(null);
  ({intro,q:question,proof,loading,proj,name:nameStep,diag,plan,sales})[s.type](s);
}

function intro(){

    <p class="note">Sin registro. No te pedimos datos para empezar.</p>
  </section>`;
  $("#go").onclick=next;
}
function question(s){
  app.innerHTML=`<section class="screen">
    ${s.kick?`<div class="kicker">${s.kick}</div>`:""}
    <h1>${s.title}</h1>
    ${s.sub?`<p class="sub">${s.sub}</p>`:""}
    <p class="hint">${s.multi?"(Podés elegir varias)":"(Elegí una opción)"}</p>
    <div class="opts">${s.opts.map(([e,t,d,v],k)=> s.fig
      ? `<button class="opt fig${isSel(s,v)?" sel":""}" data-v="${v}" id="o-${s.id}-${k}"><span class="pic">${SIL[e]}</span><span class="body"><span class="radio"></span><span class="txt"><span class="t">${t}</span><span class="d">${d}</span></span></span></button>`
      : `<button class="opt${s.multi?" multi":""}${isSel(s,v)?" sel":""}" data-v="${v}" id="o-${s.id}-${k}">${e?`<span class="em" aria-hidden="true">${e}</span>`:""}<span class="radio"></span><span class="txt"><span class="t">${t}</span>${d?`<span class="d">${d}</span>`:""}</span></button>`).join("")}
    </div>
    ${s.multi?`<div class="mt"><button class="cta" id="go"${(A[s.id]||[]).length?"":" disabled"}>Continuar</button></div>`:""}
    </section>`;
  if(s.multi){
    const go=$("#go"); go.onclick=()=>{ if((A[s.id]||[]).length) next(); };
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const arr=A[s.id]=(A[s.id]||[]).slice(); const v=b.dataset.v, k=arr.indexOf(v);
      if(k>-1) arr.splice(k,1); else arr.push(v);
      b.classList.toggle("sel",k===-1); go.disabled=!arr.length;
    });
    return;
  }
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); A[s.id]=b.dataset.v;
    timers.push(setTimeout(next,320));
  });
}
function isSel(s,v){ return s.multi ? (A[s.id]||[]).includes(v) : A[s.id]===v; }
function joinY(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1]; }
function proof(){

  $("#go").onclick=next;
}
function loading(){

  app.innerHTML=`<section class="screen">
    <h1>Estamos armando <em>tu plan</em></h1>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#efd3e1" stroke-width="9" fill="none"/><circle id="arc" cx="50" cy="50" r="44" stroke="#b8336a" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg><span id="pct">0%</span></div>
    <ul class="checks">${steps.map((t,k)=>`<li id="ck${k}"><span class="c">✓</span>${t}</li>`).join("")}</ul>
    <p class="count">Ya son <b>${ALUMNAS}</b> mujeres con su plan Adiós Panza</p>
  </section>`;
  let p=0;
  timers.push(setInterval(()=>{
    p=Math.min(100,p+2);
    $("#pct").textContent=p+"%";
    $("#arc").setAttribute("stroke-dashoffset",(276.5*(1-p/100)).toFixed(1));
    steps.forEach((_,k)=>{ if(p>=(k+1)*24) $("#ck"+k).classList.add("done"); });
    if(p>=100){ clearTimers(); timers.push(setTimeout(next,600)); }
  },70));
}

function chartSVG(){
  const pts=[[1,6,"Punto de partida"],[7,24,"Desinflamación"],[14,48,"Primeros kilos"],[21,72,"Aceleración"],[28,95,"Adiós panza"]];
  const W=320,H=210,L=34,R=14,T=26,B=30, x=d=>L+(d-1)/27*(W-L-R), y=v=>T+(1-v/100)*(H-T-B);
  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#efd3e1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#7c5a6b">${v}</text>`).join("");
  const line=pts.map(p=>`${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const area=`${x(1)},${y(0)} ${line} ${x(28)},${y(0)}`;
  const dots=pts.map((p,k)=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="5" fill="#fff" stroke="#b8336a" stroke-width="3"/><text x="${x(p[0])+(k===0?2:k===4?-2:0)}" y="${y(p[1])-11}" text-anchor="${k===0?"start":k===4?"end":"middle"}" font-size="10.5" font-weight="700" fill="#4a1530">${p[2]}</text><text x="${x(p[0])}" y="${H-10}" text-anchor="middle" font-size="10" fill="#7c5a6b">DÍA ${p[0]}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección de evolución en 28 días">${grid}<polygon points="${area}" fill="#fcebf3"/><polyline points="${line}" fill="none" stroke="#b8336a" stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`;
}
function diag(){

  app.innerHTML=`<section class="screen">
    <div class="kicker">${name?nm()+", tu análisis indicó:":"Tu análisis indicó:"}</div>
    <h1 class="script" style="font-size:clamp(36px,10vw,48px);line-height:1.05">${d.n}</h1>
    <p class="sub">${d.tag}</p>
    <div class="stack">
      <div class="card"><h3>Lo que ves en el espejo</h3><p>${d.espejo}</p></div>
      <div class="card"><h3>Lo que seguramente ya viviste</h3><p>${d.viviste}</p></div>
      <div class="card"><h3>Por qué nada funcionó hasta ahora</h3><p>${d.porque}</p></div>
      <div class="card"><h3>Lo que sí funciona para tu tipo</h3><p>${d.funciona}</p></div>
      <div class="card"><h3>El error más común de tu tipo</h3><p>${d.error}</p></div>
      ${obs.map(k=>`<div class="card hot"><h3>Tu salida para ${OBST[k].t}</h3><p>${OBST[k].s}</p></div>`).join("")}
      <div class="card sum"><p>Tu plan de 4 semanas para <b>${d.n}</b> ya está armado: <b>${MIN[A.min]||"30 a 40 minutos"}</b> por día, <b>${FREQ[A.freq]||"3 veces por semana"}</b>, con el objetivo de <b>${KG[A.kg]||"bajar de 3 a 10 kg"}</b> y ${obs.length>1?"las salidas":"la salida"} para <b>${ot}</b> ${obs.length>1?"incluidas":"incluida"}. Las mujeres de <b>${AGE[A.edad]||"tu edad"}</b> con este perfil suelen notar la ropa más floja en la primera semana.</p></div>
      <div class="chart"><h3>Proyección de tu evolución en las 4 semanas</h3>${chartSVG()}</div>
    </div>
  </section>`;
  sticky(`Acceder a mi plan para ${d.n}`, next);
}

        <details><summary>¿Es para principiantes o para alguien que ya entrena?</summary><div class="ac"><p>Para las dos. Todas las rutinas tienen nivel inicial, intermedio y avanzado. El plan se adapta a vos, no al revés.</p></div></details>
        <details><summary>¿Y si tengo dudas después de comprar?</summary><div class="ac"><p>No es personalizado, pero podés escribirnos al mail y te respondemos todas tus consultas.</p></div></details>
      </div>
    </div>
    <p class="foot">Silvia Fitness · Adiós Panza en 4 Semanas</p>
  </section>`;
  sticky("Quiero mi lugar con 50% off", buy, "🔒 Pago seguro · Acceso inmediato", CK()||null);
  let left=600;
  timers.push(setInterval(()=>{
    left=Math.max(0,left-1);
    $("#tm").textContent=String(Math.floor(left/60)).padStart(2,"0");
    $("#ts").textContent=String(left%60).padStart(2,"0");
  },1000));
  timers.push(setInterval(()=>{ const v=$("#viewers"); v.textContent=Math.max(24,Math.min(41,+v.textContent+(Math.random()<.5?-1:1))); },4000));
}
render();
