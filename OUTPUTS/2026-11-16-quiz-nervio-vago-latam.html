s se me aflojó el cuello y la presión en el pecho bajó muchísimo.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Laura M., 38 · Bogotá"}, {"id": "b2tdkfg", "body": "“Por fin entendí qué me pasaba”. Tenía mareos, contracturas y me despertaba a las 4 de la mañana todos los días. Lo hice tal cual dice el plan y hoy tengo energía para salir a caminar con mis nietas.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Mónica R., 56 · Lima"}, {"id": "b2uki5g", "type": "faq", "items": [{"text": "Sí. El nervio vago es uno de los nervios más estudiados del cuerpo. La respiración lenta, el tarareo y el frío son formas conocidas de estimularlo y de ayudar al cuerpo a salir del modo de estrés.", "title": "¿Esto tiene base científica?"}, {"text": "Muchas personas notan que duermen mejor y se sienten más tranquilas en la primera o segunda semana. El cambio fuerte en la energía suele llegar entre la semana 3 y la 4.", "title": "¿Cuánto tarda en hacer efecto?"}, {"text": "La mayoría probó soluciones para el síntoma (pastillas para dormir, masajes, más café). Este plan va al sistema que maneja el estrés.", "title": "¿Y si ya probé de todo?"}, {"text": "No. Pagas una sola vez y el plan es tuyo para siempre. Sin cargos automáticos.", "title": "¿Es una suscripción?"}, {"text": "Apenas pagas te llega todo por correo para descargar: el plan de 28 días y los 3 bonos.", "title": "¿Cómo lo recibo?"}]}, {"id": "b2v7cka", "text": "🛡️ Garantía de 7 días: si sientes que no es para ti, te devolvemos el 100%. Sin vueltas.", "tone": "info", "type": "banner"}, {"id": "b2w01mb", "type": "button", "label": "Quiero mi plan de 28 días", "action": "checkout"}, {"id": "b2xzk69", "size": "sm", "text": "Este plan es educativo y no reemplaza la consulta con un profesional de la salud. Los resultados varían según cada persona.", "type": "text", "align": "center"}], "outcome": {"key": "leve", "max": 45, "min": 0}, "showLogo": true, "showProgress": false}, {"id": "r2", "block testándoles mal a mis hijos por todo. A la tercera semana dormí de corrido por primera vez en meses.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Carolina G., 44 · Guadalajara"}, {"id": "b3dvxwv", "body": "“Se me fue el nudo en el pecho”. Pensé que era la edad o que estaba quemada del trabajo. Los ejercicios son cortitos, los hago en la mañana con mi café. En dos semanas se me aflojó el cuello y la presión en el pecho bajó muchísimo.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Laura M., 38 · Bogotá"}, {"id": "b3emla6", "body": "“Por fin entendí qué me pasaba”. Tenía mareos, contracturas y me despertaba a las 4 de la mañana todos los días. Lo hice tal cual dice el plan y hoy tengo energía para salir a caminar con mis nietas.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Mónica R., 56 · Lima"}, {"id": "b3fklf0", "type": "faq", "items": [{"text": "Sí. El nervio vago es uno de los nervios más estudiados del cuerpo. La respiración lenta, el tarareo y el frío son formas conocidas de estimularlo y de ayudar al cuerpo a salir del modo de estrés.", "title": "¿Esto tiene base científica?"}, {"text": "Muchas personas notan que duermen mejor y se sienten más tranquilas en la primera o segunda semana. El cambio fuerte en la energía suele llegar entre la semana 3 y la 4.", "title": "¿Cuánto tarda en hacer efecto?"}, {"text": "La mayoría probó soluciones para el síntoma (pastillas para dormir, masajes, más café). Este plan va al sistema que maneja el estrés.", "title": "¿Y si ya probé de todo?"}, {"text": "No. Pagas una sola vez y el plan es tuyo para siempre. Sin cargos automáticos.", "title": "¿Es una suscripción?"}, {"text": "Apenas pagas te llega todo por correo para descargar: el plan de 28 días y los 3 bonos.", "title": "¿Cómo lo recibo?"}]}, {"id": "b3g0f5f", "text": "🛡️ Garantía de 7 días: si sientes que no es para ti, te devolvemos el 100%. Sin vueltas.", "tone": "info", "type": "banner"}, {"id": "b3hbbnm", d"}, {"text": "Adiós a la niebla mental y los olvidos"}, {"text": "Duermes de corrido y te despiertas descansada"}, {"text": "El cuello, la mandíbula y los hombros se aflojan"}, {"text": "Dejas de contestarles mal a los tuyos por cualquier cosa"}]}, {"id": "b3x6nez", "body": "“Mi esposo me dijo: volviste”. Dos médicos me dijeron que lo mío era estrés. Vivía cansada, con la cabeza en una nube y contestándoles mal a mis hijos por todo. A la tercera semana dormí de corrido por primera vez en meses.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Carolina G., 44 · Guadalajara"}, {"id": "b3ylu2l", "body": "“Se me fue el nudo en el pecho”. Pensé que era la edad o que estaba quemada del trabajo. Los ejercicios son cortitos, los hago en la mañana con mi café. En dos semanas se me aflojó el cuello y la presión en el pecho bajó muchísimo.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Laura M., 38 · Bogotá"}, {"id": "b3zaduk", "body": "“Por fin entendí qué me pasaba”. Tenía mareos, contracturas y me despertaba a las 4 de la mañana todos los días. Lo hice tal cual dice el plan y hoy tengo energía para salir a caminar con mis nietas.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Mónica R., 56 · Lima"}, {"id": "b40xx70", "type": "faq", "items": [{"text": "Sí. El nervio vago es uno de los nervios más estudiados del cuerpo. La respiración lenta, el tarareo y el frío son formas conocidas de estimularlo y de ayudar al cuerpo a salir del modo de estrés.", "title": "¿Esto tiene base científica?"}, {"text": "Muchas personas notan que duermen mejor y se sienten más tranquilas en la primera o segunda semana. El cambio fuerte en la energía suele llegar entre la semana 3 y la 4.", "title": "¿Cuánto tarda en hacer efecto?"}, {"text": "La mayoría probó soluciones para el síntoma (pastillas para dormir, masajes, más café). Este plan va al sistema que maneja el estrés.", "title": "¿Y si ya probé de todo?"}, {"text": "No. Pagas una sola vez y el plan es tuyo para siempre. Sin cargos automáticos.", "title": "¿Es una suscripción?"}, {"text": "Apenas pagas te llega todo por correo para descargar: el plan de 28 días y los 3 bonos.", "title": "¿Cómo lo recibo?"}]}, {"id": "b410nzz", "text": "🛡️ Garantía de 7 días: si sientes que no es para ti, te devolvemos el 100%. Sin vueltas.", "tone": "info", "type": "banner"}, {"id": "b42ltaz", "type": "button", "label": "Quiero mi plan de 28 días", "action": "checkout"}, {"id": "b4356zv", "size": "sm", "text": "Este plan es educativo y no reemplaza la consulta con un profesional de la salud. Los resultados varían según cada persona.", "type": "text", "align": "center"}], "outcome": {"key": "alta", "max": 9999, "min": 86}, "showLogo": true, "showProgress": false}, {"id": "b2", "blocks": [{"id": "nvb01", "size": "sm", "text": "PREGUNTA 2 DE 5", "type": "text", "align": "center", "weight": "bold"}, {"id": "nvb02", "size": "lg", "text": "¿Qué es lo que *más te pesa* hoy?", "type": "text", "align": "center", "weight": "bold"}, {"id": "nvb03", "size": "sm", "text": "Elige la que más te identifique", "type": "text", "align": "center"}, {"id": "nvb04", "type": "options", "options": [{"key": "a", "icon": "😩", "label": "Me levanto cansada aunque duerma", "score": 0}, {"key": "b", "icon": "🌀", "label": "La ansiedad: la cabeza no para", "score": 0}, {"key": "c", "icon": "🌙", "label": "Me despierto de madrugada", "score": 0}, {"key": "d", "icon": "🔩", "label": "El cuello, la mandíbula o los hombros duros", "score": 0}, {"key": "e", "icon": "🧠", "label": "La cabeza nublada, me olvido de todo", "score": 0}], "question": "", "autoAdvance": true}], "outcome": {"max": 10000000, "min": 1000000}, "showLogo": true, "showProgress": false}, {"id": "b3", "blocks": [{"id": "nvb05", "size": "sm", "text": "PREGUNTA 3 DE 5", "type": "text", "align": "center", "weight": "bold"}, {"id": "nvb06", "size": "lg", "text": "¿Cada cuánto sientes el cuerpo *en modo alerta*?", "type": "text", "align" e": "testimonial", "handle": "", "rating": 5, "authorName": "Carolina G., 44 · Guadalajara"}, {"id": "nvr28", "body": "“Se me fue el nudo en el pecho”. Pensé que era la edad o que estaba quemada del trabajo. Los ejercicios son cortitos, los hago en la mañana con mi café. En dos semanas se me aflojó el cuello y la presión en el pecho bajó muchísimo.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Laura M., 38 · Bogotá"}, {"id": "nvr29", "body": "“Por fin entendí qué me pasaba”. Tenía mareos, contracturas y me despertaba a las 4 de la mañana todos los días. Lo hice tal cual dice el plan y hoy tengo energía para salir a caminar con mis nietas.", "type": "testimonial", "handle": "", "rating": 5, "authorName": "Mónica R., 56 · Lima"}, {"id": "nvr30", "type": "faq", "items": [{"text": "Sí. El nervio vago es uno de los nervios más estudiados del cuerpo. La respiración lenta, el tarareo y el frío son formas conocidas de estimularlo y de ayudar al cuerpo a salir del modo de estrés.", "title": "¿Esto tiene base científica?"}, {"text": "Muchas personas notan que duermen mejor y se sienten más tranquilas en la primera o segunda semana. El cambio fuerte en la energía suele llegar entre la semana 3 y la 4.", "title": "¿Cuánto tarda en hacer efecto?"}, {"text": "La mayoría probó soluciones para el síntoma (pastillas para dormir, masajes, más café). Este plan va al sistema que maneja el estrés.", "title": "¿Y si ya probé de todo?"}, {"text": "No. Pagas una sola vez y el plan es tuyo para siempre. Sin cargos automáticos.", "title": "¿Es una suscripción?"}, {"text": "Apenas pagas te llega por correo el acceso a tu app, con el plan de 28 días y los 3 bonos.", "title": "¿Cómo lo recibo?"}]}, {"id": "nvr21", "text": "🛡️ Garantía de 7 días: si sientes que no es para ti, te devolvemos el 100%. Sin vueltas.", "tone": "info", "type": "banner"}, {"id": "nvr22", "type": "button", "label": "Quiero mi plan de 28 días", "action": "checkout"}, {"id": "nvr23", "size": "sm", "tex <script>
/* Pixel de Meta (el motor dispara InitiateCheckout al tocar un CTA). */
(function(){var id=(window.CONFIG_QUIZ||{}).PIXEL_ID;if(!id)return;
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init',id);fbq('track','PageView')})();

/* Checkout del CONFIG + UTMs de la URL en la sesion (lo que lee el motor). */
(function(){try{
  var el=document.getElementById('quiz-data');var D=JSON.parse(el.textContent);
  D.checkoutBase=(window.CONFIG_QUIZ||{}).CHECKOUT||'/checkout';

  var q=new URLSearchParams(location.search),u={};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_adset','utm_id',
   'fbclid','gclid','ttclid','msclkid','twclid','xcod','sck'].forEach(function(k){
     if(q.get(k))u[k]=q.get(k)});
  try{var p=JSON.parse(sessionStorage.getItem('impultienda_utm')||'{}');
      for(var k in p)if(!(k in u))u[k]=p[k];
      sessionStorage.setItem('impultienda_utm',JSON.stringify(u))}catch(e){}

  /* Las fotos van una sola vez de data URI a Blob URL: un blob se cachea y se
     decodifica una vez sola, un data URI se vuelve a decodificar en cada paso.
     Si la tienda bloqueara blob: por CSP, el listener de error devuelve la
     imagen a su data URI y el quiz no se queda sin fotos. */
  window.IMGRAW={};window.__pre=[];
  var txt=JSON.stringify(D),vistas={},i=0;
  txt=txt.replace(/data:image\/[a-z+]+;base64,[A-Za-z0-9+\/=]+/g,function(uri){
    if(vistas[uri])return vistas[uri];
    try{
      var c=uri.split(',')[1],m=uri.slice(5,uri.indexOf(';')),bin=atob(c),
          arr=new Uint8Array(bin.length);
      for(var j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
      var b=URL.createObjectURL(new Blob([arr],{type:m}));
      window.IMGRAW[b]=uri;vistas[uri]=b;i++;return b;
    }catch(e){return uri}
  });
  window.__preTotal=i;
  el.textContent=txt;

  Object.keys(window.IMGRAW).forEach(function(b){
    var im=new Image();im.src=b;window.__pre.push(im);
    if(im.decode)im.decode().catch(function(){});
  });
  document.addEventListener('error',function(ev){
    var t=ev.target;
    if(t&&t.tagName==='IMG'&&t.src.indexOf('blob:')===0&&window.IMGRAW[t.src])
      t.src=window.IMGRAW[t.src];
  },true);
}catch(e){}})();
</script>

<script>// Quiz funnel runtime (engine v2 — block-based screens).
//
// A quiz is `{ steps: Screen[] }`. A Screen is a STACK OF BLOCKS the seller
// composes from a palette (Inlead-style): text, image, video, field, button,
// options, multi, yesno, banner, timer, loading, gauge, authority, benefits,
// testimonial, faq, checklist, beforeafter, carousel, chart, spacer, html.
//
// Navigation (mixed): a single-select `options`/`yesno` block auto-advances on
// pick; screens with fields/multi advance via a `button` block ("Continuar").
// The funnel closes on a `button action:'checkout'` → the store checkout.
//
// Legacy v1 specs (typed steps) are auto-converted via stepToBlocks(), so old
// quizzes keep rendering. Pure vanilla JS, inlined via `<script set:html>`.
//
// Two non-public modes (data island): `preview` (no writes/redirect/pixels) and
// `edit` (click-to-edit: posts `quiz-edit {stepId, blockId}` to the dashboard).
;(function () {
  var dataEl = document.getElementById('quiz-data')
  var root = document.getElementById('quiz-root')
  if (!dataEl || !root) return

  var D
  try { D = JSON.parse(dataEl.textContent || '{}') } catch (e) { return }
  var spec = D.spec || { steps: [] }
  var steps = Array.isArray(spec.steps) ? spec.steps : []
  var theme = D.theme || {}

  var supabaseUrl = D.supabaseUrl
  var supabaseKey = D.supabaseKey
  var quizId = D.quizId
  var preview = !!D.preview
  var edit = !!D.edit

  if (edit) {
    var st = document.createElement('style')
    st.textContent =
      '[data-qedit]{cursor:pointer;transition:outline .12s ease;border-radius:6px}' +
      '[data-qedit]:hover{outline:2px dashed var(--quiz-accent,#7c3aed);outline-offset:3px}'
    document.head.appendChild(st)
  }

  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID()
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16)
    })
  }

  var state = { i: 0, answers: {}, score: 0, lead: {}, outcomeKey: null, responseId: uuid() }
  var sessionId = null
  try { sessionId = sessionStorage.getItem('impultienda_session_id') } catch (e) {}

  function getUtm() { try { return JSON.parse(sessionStorage.getItem('impultienda_utm') || '{}') } catch (e) { return {} } }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }
  // Reescribe URLs públicas de Supabase Storage al transformador de imágenes
  // (resize + WebP). Copia en JS plano de src/lib/imageUrl.ts::optimizedImage
  // (este script se inyecta con ?raw y no puede importar el módulo TS) — si
  // cambia la lógica allá, espejarla acá. No-op para URLs externas/ya
  // transformadas; conserva el cache-buster ?t=.
  function optImg(url, w) {
    if (!url || typeof url !== 'string') return ''
    var PUB = '/storage/v1/object/public/'
    if (url.indexOf(PUB) === -1) return url
    var base = url, qs = ''
    var q = url.indexOf('?')
    if (q !== -1) { base = url.slice(0, q); qs = url.slice(q + 1) }
    if (/(^|&)width=/.test(qs)) return url
    qs += (qs ? '&' : '') + 'width=' + w + '&quality=75&resize=contain'
    return base.replace(PUB, '/storage/v1/render/image/public/') + '?' + qs
  }
  // *accent* markup → accent span (after escaping).
  function fmt(s) { return esc(s).replace(/\*([^*]+)\*/g, '<span class="quiz-am">$1</span>') }
  // {name} token → captured lead name.
  function fillTokens(s) {
    var name = (state.lead && state.lead.name) || ''
    return String(s == null ? '' : s).replace(/\{name\}/g, name).replace(/\s{2,}/g, ' ').trim()
  }
  function videoEmbed(url) {
    if (!url) return null
    var yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([\w-]{11})/)
    if (yt) return 'https://www.youtube.com/embed/' + yt[1]
    var vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/)
    if (vm) return 'https://player.vimeo.com/video/' + vm[1]
    return null
  }
  function de(field) { return edit ? ' data-qedit="' + esc(field) + '"' : '' }

  function save(status) {
    if (preview || !supabaseUrl || !supabaseKey) return
    fetch(supabaseUrl + '/rest/v1/rpc/quiz_response_save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: supabaseKey, Authorization: 'Bearer ' + supabaseKey },
      body: JSON.stringify({
        p_id: state.responseId, p_quiz_id: quizId, p_session_id: sessionId,
        p_email: state.lead.email || null, p_name: state.lead.name || null, p_phone: state.lead.phone || null,
        p_answers: state.answers, p_score: state.score, p_outcome_key: state.outcomeKey,
        p_utm: getUtm(), p_status: status,
      }),
    }).catch(function () {})
  }
  function track(ev, data) { if (preview) return; try { if (window.fbq) window.fbq('track', ev, data || {}) } catch (e) {} }

  // Abandono por pantalla (migración 247): una vista por (visitante, pantalla),
  // desde la primera y sin exigir email. '__checkout' = tocó el botón al
  // checkout. Mismos cortes que tracking.js (local, ?store_id, bots de
  // automatización); el crawler de Meta lo descarta el server.
  var stepTracking = !preview && !edit && !!(supabaseUrl && supabaseKey && quizId)
  try {
    var h = window.location.hostname
    var isLocalHost = h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.indexOf('192.168.') === 0 || h.indexOf('10.') === 0
    var qp = new URLSearchParams(window.location.search)
    // Dev escape hatch (mismo que tracking.js): `?forceTrack=1` SOLO en host
    // local, para probar el embudo end-to-end con `/q/<slug>?store_id=…`.
    var devForce = isLocalHost && qp.get('forceTrack') === '1'
    if (isLocalHost && !devForce) stepTracking = false
    if (qp.get('store_id') && !devForce) stepTracking = false
    if (navigator.webdriver) stepTracking = false
  } catch (e) {}
  var visitorId = null
  var seenSteps = {}
  function stepView(stepId, idx) {
    if (!stepTracking || !stepId || seenSteps[stepId]) return
    seenSteps[stepId] = 1
    if (!visitorId) {
      var vk = 'impultienda_quiz_vid_' + quizId
      try { visitorId = sessionStorage.getItem(vk) } catch (e) {}
      if (!visitorId) {
        visitorId = uuid()
        try { sessionStorage.setItem(vk, visitorId) } catch (e) {}
      }
    }
    try {
      fetch(supabaseUrl + '/rest/v1/rpc/quiz_step_view', {
        method: 'POST',
        keepalive: true,
        headers: { 'Content-Type': 'application/json', apikey: supabaseKey, Authorization: 'Bearer ' + supabaseKey },
        body: JSON.stringify({ p_quiz_id: quizId, p_visitor_id: visitorId, p_step_id: String(stepId), p_step_index: idx }),
      }).catch(function () {})
    } catch (e) {}
  }

  function checkoutHref() {
    // Per-band checkout: a score-gated screen can carry its own funnel target;
    // otherwise fall back to the quiz-level base (settings.target → /checkout).
    var scr = steps[state.i]
    var t = scr && scr.outcome && scr.outcome.target
    var base = (t && t.kind === 'funnel' && t.ref) ? '/checkout/' + t.ref : (D.checkoutBase || '/checkout')
    var sp = new URLSearchParams(); var u = getUtm()
    // Local dev / opened via /q/<slug>?store_id=… (no subdomain for the
    // middleware to resolve): go straight to c-checkout with the store id,
    // translating /checkout/<slug> → ?f=<slug> (same rewrite the middleware
    // does in production).
    var sid = null
    try { sid = new URLSearchParams(window.location.search).get('store_id') } catch (e) {}
    if (sid) {

    }
    sp.set('utm_source', u.utm_source || 'quiz')
    if (u.utm_medium) sp.set('utm_medium', u.utm_medium)
    sp.set('utm_campaign', u.utm_campaign || D.slug || 'quiz')
    if (u.utm_content) sp.set('utm_content', u.utm_content)
    if (u.utm_term) sp.set('utm_term', u.utm_term)
    if (u.utm_adset) sp.set('utm_adset', u.utm_adset)
    // utm_id (= {{ad.id}}) es lo que cruza gasto ↔ ventas en el cockpit de Meta
    // Ads, y los click ids reponen la cookie del pixel si se perdió: mismo set
    // que arrastran tracking.js y el resto de los CTAs.
    if (u.utm_id) sp.set('utm_id', u.utm_id)

    for (var ci = 0; ci < CLICK.length; ci++) if (u[CLICK[ci]]) sp.set(CLICK[ci], u[CLICK[ci]])
    // Cupón del link (?cupon=CODIGO): el quiz navega por JS, así que tracking.js
    // no lo puede pegar en el click; lo resuelve él (window.__impuCupon).
    var cupv = ''
    try { cupv = (window.__impuCupon && window.__impuCupon()) || '' } catch (e) { cupv = '' }

  // Score gate: a screen with `outcome` only shows when the accumulated score
  // falls inside its [min, max] band. Screens without a gate always match.
  function gateMatches(screen) {
    var g = screen && screen.outcome
    if (!g) return true
    var min = typeof g.min === 'number' ? g.min : 0
    var max = typeof g.max === 'number' ? g.max : Infinity
    return state.score >= min && state.score <= max
  }

  function go(next) {
    if (edit) return
    var target = Math.max(0, Math.min(next, steps.length - 1))
    var dir = target >= state.i ? 1 : -1
    var j = target
    // Skip gated screens whose band doesn't match, in the direction of travel
    // (also on "back", so the visitor never re-enters a foreign band).
    while (j > 0 && j < steps.length - 1 && !gateMatches(steps[j])) j += dir
    if (!gateMatches(steps[j])) j = target // never dead-end
    state.i = j
    var g = steps[state.i] && steps[state.i].outcome
    if (g && g.key && gateMatches(steps[state.i])) state.outcomeKey = g.key
    render()
    try { root.scrollIntoView({ behavior: 'smooth', block: 'start' }) } catch (e) {}
  }

  // ---------------------------------------------------------------------------
  // Legacy (v1 typed step) → blocks. Keeps old/AI-v1 specs rendering.
  // ---------------------------------------------------------------------------
  function stepToBlocks(step) {
    if (Array.isArray(step.blocks) && step.blocks.length) return step.blocks
    var b = []; var n = 0
    function id() { return step.id + '_' + (n++) }
    function txt(t, size, weight) { return { id: id(), type: 'text', text: t, size: size, weight: weight, align: 'center' } }
    function media() {
      if (step.video) b.push({ id: id(), type: 'video', url: step.video })
      else if (step.image) b.push({ id: id(), type: 'image', url: step.image })
    }
    var T = step.type
    if (T === 'intro') {
      if (step.banner && step.banner.text) b.push({ id: id(), type: 'banner', text: step.banner.text, tone: step.banner.tone || 'warning' })
      if (step.badge) b.push(txt(step.badge, 'sm', 'bold'))
      if (step.title) b.push(txt(step.title, 'xl', 'bold'))
      if (step.subtitle) b.push(txt(step.subtitle))
      media()
      if (step.authority && (step.authority.name || step.authority.image)) b.push({ id: id(), type: 'authority', name: step.authority.name, role: step.authority.role, badge: step.authority.badge, image: step.authority.image })
      if (Array.isArray(step.checklist) && step.checklist.length) b.push({ id: id(), type: 'checklist', items: step.checklist.map(function (t) { return { text: t } }) })
      b.push({ id: id(), type: 'button', label: step.cta || 'Comenzar', action: 'next' })
    } else if (T === 'single_choice' || T === 'commit') {
      if (step.question) b.push(txt(step.question, 'lg', 'bold'))
      media()
      b.push({ id: id(), type: 'options', options: step.options, layout: step.layout, optionStyle: step.optionStyle, imageSide: step.imageSide, empathyBox: step.empathyBox, autoAdvance: true })
    } else if (T === 'multi_choice') {
      if (step.question) b.push(txt(step.question, 'lg', 'bold'))
      media()
      b.push({ id: id(), type: 'multi', options: step.options, layout: step.layout, optionStyle: step.optionStyle, imageSide: step.imageSide, minSelect: step.minSelect, empathyBox: step.empathyBox })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'interstitial') {
      if (step.icon) b.push(txt(step.icon, 'xl'))
      media()
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      if (step.body) b.push(txt(step.body))
      if (step.quote) b.push(txt(step.quote))
      if (step.pill) b.push({ id: id(), type: 'banner', text: step.pill, tone: 'info' })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'lead_capture') {
      if (step.headline) b.push(txt(step.headline, 'lg', 'bold'))
      ;(step.fields && step.fields.length ? step.fields : ['email', 'name']).forEach(function (f) { b.push({ id: id(), type: 'field', field: f }) })
      b.push({ id: id(), type: 'button', label: step.cta || 'Ver mi resultado', action: 'next' })
    } else if (T === 'slider') {
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      if (step.subtitle) b.push(txt(step.subtitle))
      b.push({ id: id(), type: 'field', field: 'height', min: step.min, max: step.max, value: step.value, unit: step.unit, unitAlt: step.unitAlt })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'loader') {
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      b.push({ id: id(), type: 'loading', durationSec: step.durationSec, images: step.images, text: step.body })
    } else if (T === 'testimonial') {
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      media()
      b.push({ id: id(), type: 'testimonial', authorName: step.authorName, handle: step.handle, rating: step.rating, body: step.body })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'diagnostic') {
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      media()
      b.push({ id: id(), type: 'gauge', metricLabel: step.metricLabel, text: step.subtitle, gaugeLabels: step.gaugeLabels, gaugeMarker: step.gaugeMarker, note: step.note })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'projection') {
      if (step.title) b.push(txt(step.title, 'lg', 'bold'))
      if (step.subtitle) b.push(txt(step.subtitle))
      b.push({ id: id(), type: 'chart', startValue: step.startValue, endValue: step.endValue, unit: step.unit, startLabel: step.startLabel, endLabel: step.endLabel })
      b.push({ id: id(), type: 'button', label: step.cta || 'Continuar', action: 'next' })
    } else if (T === 'result') {
      // Pick the outcome whose `min` is the highest one the score reaches
      // (outcomes sorted ascending; fallback to the lowest band).
      var outs = (step.outcomes || []).slice().sort(function (a, c) { return (a.min || 0) - (c.min || 0) })
      var o = outs[0] || { headline: '¡Listo!', body: '', ctaLabel: 'Continuar' }
      for (var oi = 0; oi < outs.length; oi++) if (state.score >= (outs[oi].min || 0)) o = outs[oi]
      if (o.key) state.outcomeKey = o.key
      b.push({ id: id(), type: 'text', text: '✓', size: 'xl', align: 'center' })
      b.push(txt(o.headline, 'xl', 'bold'))
      if (o.body) b.push(txt(o.body))
      b.push({ id: id(), type: 'button', label: o.ctaLabel || 'Continuar', action: 'checkout' })
    } else {
      // Unknown/empty screen → a single continue button so it's not a dead end.
      b.push({ id: id(), type: 'button', label: 'Continuar', action: 'next' })
    }
    return b
  }

  function progressBar(screen) {
    if (screen.showProgress === false) return ''
    // Solo las pantallas de pregunta del carril en el que esta la persona.
    // (El conteo original colapsaba las 35 pantallas con `outcome` en una sola
    //  y dejaba la barra en 100 % desde la primera pregunta.)
    var total = 0, pos = 0
    for (var k = 0; k < steps.length; k++) {
      var s = steps[k]
      if (!s || s.showProgress === false) continue
      if (!gateMatches(s)) continue
      total++
      if (k <= state.i) pos++
    }
    var pct = total > 0 ? Math.min(100, Math.round((pos / total) * 100)) : 100
    return '<div class="quiz-progress"><div class="quiz-progress-bar" style="width:' + pct + '%"></div></div>'
  }
  function headerBar(screen) {

    // toggle in the builder is visible without switching to play mode.
    var back = (screen.allowBack !== false && state.i > 0) ? '<button class="quiz-back" data-act="back" aria-label="Volver">‹</button>' : ''
    var lh = (theme && typeof theme.logoSize === 'number' && theme.logoSize > 0) ? ' style="height:' + theme.logoSize + 'px"' : ''
    var logo = (screen.showLogo && theme.logoUrl) ? '<img class="quiz-head-logo" decoding="async" src="' + esc(optImg(theme.logoUrl, 240)) + '"' + lh + ' alt="" />' : ''
    if (!back && !logo) return ''
    return '<div class="quiz-head">' + back + logo + '</div>'
  }

  function render() {
    if (!steps.length) { root.innerHTML = '<div class="quiz-card"><p>Este quiz todavía no tiene contenido.</p></div>'; return }
    var screen = steps[state.i] || steps[0]
    stepView(screen && screen.id, steps[state.i] ? state.i : 0)
    var blocks = stepToBlocks(screen)
    var hasCheckout = blocks.some(function (b) { return b.type === 'button' && b.action === 'checkout' })
    var hasButton = blocks.some(function (b) { return b.type === 'button' })
    var hasInteractive = blocks.some(function (b) { return b.type === 'multi' || b.type === 'field' })
    var bodyHtml = blocks.map(renderBlock).join('')
    // Safety net: a screen with fields/multi but no button can't advance — add one.
    if (!hasButton && hasInteractive) bodyHtml += '<button class="quiz-btn" data-act="next">Continuar</button>'

    if (hasCheckout && !preview && !edit) {
      var og = screen.outcome
      state.outcomeKey = (og && og.key) || state.outcomeKey || 'done'
      save('completed')
    }

    root.innerHTML = headerBar(screen) + progressBar(screen) + '<div class="quiz-card quiz-fade">' + bodyHtml + '</div>'
    // innerHTML never executes <script> — re-create the ones inside html blocks
    // so pasted embeds run. Re-runs on every render of the screen (same as a
    // fresh page load would). Edit mode renders html blocks escaped, no scripts.
    if (!edit) {
      root.querySelectorAll('.quiz-html script').forEach(function (old) {
        var s = document.createElement('script')
        for (var a = 0; a < old.attributes.length; a++) s.setAttribute(old.attributes[a].name, old.attributes[a].value)
        s.text = old.text || ''
        old.parentNode.replaceChild(s, old)
      })
    }
    bind(screen)
  }

  // Collect field values + multi selections on the current screen (button paths).
  function collectScreen() {
    root.querySelectorAll('[data-field]').forEach(function (el) {
      var f = el.getAttribute('data-field'); var v = (el.value || '').trim()
      if (!v) return
      if (f === 'name' || f === 'email' || f === 'phone') state.lead[f] = v
      else state.answers[f] = v
    })
    root.querySelectorAll('.quiz-field-slider').forEach(function (el) {
      var rg = el.querySelector('.quiz-range'); if (rg) state.answers[el.getAttribute('data-bid')] = Number(rg.value)
    })
    root.querySelectorAll('[data-block-options], .quiz-block').forEach(function () {})
    root.querySelectorAll('.quiz-multi-opt.quiz-opt-selected').forEach(function (el) {
      var bid = el.getAttribute('data-bid'); var idx = parseInt(el.getAttribute('data-idx'), 10)
      var blk = stepToBlocks(steps[state.i]).filter(function (b) { return b.id === bid })[0]
      var opt = blk && (blk.options || [])[idx]
      if (opt) {
        var arr = state.answers[bid] || []; if (arr.indexOf(opt.key) === -1) { arr.push(opt.key); state.score += typeof opt.score === 'number' ? opt.score : 0 }
        state.answers[bid] = arr
      }
    })
  }

  function advance() {
    collectScreen()
    if (state.lead.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(state.lead.email)) save('partial')
    go(state.i + 1)
  }

  function bind(screen) {
    if (edit) {
      root.querySelectorAll('[data-qedit]').forEach(function (el) {
        el.onclick = function (ev) {
          ev.preventDefault(); ev.stopPropagation()
          var f = this.getAttribute('data-qedit')
          var blockId = f.indexOf('block:') === 0 ? f.slice(6) : null
          window.parent.postMessage({ type: 'quiz-edit', stepId: screen.id, blockId: blockId, field: f }, '*')
        }
      })
      var lf = root.querySelector('form'); if (lf) lf.onsubmit = function (e) { e.preventDefault() }
      return
    }

    var back = root.querySelector('[data-act="back"]'); if (back) back.onclick = function () { go(state.i - 1) }

    // single-select options / yesno → record + auto-advance
    root.querySelectorAll('[data-act="choose"]').forEach(function (el) {
      el.onclick = function () {
        var bid = this.getAttribute('data-bid'); var idx = parseInt(this.getAttribute('data-idx'), 10)
        var blk = stepToBlocks(steps[state.i]).filter(function (b) { return b.id === bid })[0]
        var opt = blk && (blk.options || [])[idx]
        // yesno synth options live only in markup; fall back to score from label
        if (opt) { state.answers[bid] = opt.key; state.score += typeof opt.score === 'number' ? opt.score : 0 }
        advance()
      }
    })

    // multi toggle + empathy reveal
    root.querySelectorAll('[data-block-options], .quiz-block').forEach(function () {})
    root.querySelectorAll('[data-act="toggle"]').forEach(function (el) {
      el.onclick = function () {
        this.classList.toggle('quiz-opt-selected')
        var box = this.closest('.quiz-block') ? this.closest('.quiz-block').querySelector('[data-empathy]') : null
        if (box) box.hidden = !this.closest('.quiz-block').querySelector('.quiz-opt-selected')
      }
    })

    // slider live value + unit toggle
    root.querySelectorAll('.quiz-field-slider').forEach(function (el) {
      var rg = el.querySelector('.quiz-range'), sv = el.querySelector('[data-sval]')
      if (rg && sv) rg.oninput = function () { sv.textContent = this.value }
      el.querySelectorAll('[data-act="unit"]').forEach(function (u) {
        u.onclick = function () {
          el.querySelectorAll('[data-act="unit"]').forEach(function (z) { z.classList.remove('active') })
          this.classList.add('active'); var su = el.querySelector('[data-sunit]'); if (su) su.textContent = this.getAttribute('data-unit')
        }
      })
    })

    // buttons
    root.querySelectorAll('[data-act="next"]').forEach(function (el) { el.onclick = advance })
    root.querySelectorAll('[data-act="link"]').forEach(function (el) { el.onclick = function () { var h = this.getAttribute('data-href'); if (h) window.location.href = h; else advance() } })
    root.querySelectorAll('[data-act="checkout"]').forEach(function (el) {
      el.onclick = function () { collectScreen(); track('InitiateCheckout'); save('completed'); stepView('__checkout', 10000); if (preview) return; window.location.href = checkoutHref() }
    })

    // countdown timers
    root.querySelectorAll('[data-timer]').forEach(function (el) {
      var s = parseInt(el.getAttribute('data-timer'), 10) || 0
      var iv = setInterval(function () {
        s--; if (s < 0) { clearInterval(iv); return }
        var m = Math.floor(s / 60), ss = s % 60; el.textContent = m + ':' + (ss < 10 ? '0' : '') + ss
      }, 1000)
    })

    // loading bar → auto-advance
    var bar = root.querySelector('[data-loadbar]')
    if (bar) {
      var dur = 4
      var lb = stepToBlocks(screen).filter(function (b) { return b.type === 'loading' })[0]
      if (lb && typeof lb.durationSec === 'number' && lb.durationSec > 0) dur = lb.durationSec
      bar.style.transition = 'width ' + dur + 's linear'; requestAnimationFrame(function () { bar.style.width = '100%' })
      var pctEl = root.querySelector('[data-loadpct]'), start = null
      function tick(ts) { if (start == null) start = ts; var p = Math.min(100, Math.round(((ts - start) / (dur * 1000)) * 100)); if (pctEl) pctEl.textContent = p; if (p < 100) requestAnimationFrame(tick) }
      requestAnimationFrame(tick)
      var imgs = root.querySelectorAll('.quiz-loader-img'); var civ = null
      if (imgs.length > 1) { var ci = 0; civ = setInterval(function () { imgs[ci].classList.remove('on'); ci = (ci + 1) % imgs.length; imgs[ci].classList.add('on') }, Math.max(700, (dur * 1000) / imgs.length)) }
      setTimeout(function () { if (civ) clearInterval(civ); go(state.i + 1) }, dur * 1000)
    }
  }

  // Dashboard live preview: re-render on spec/accent/step changes.
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data
    if (!d || d.type !== 'quiz-preview-update') return
    if (d.accent) { try { document.querySelector('.quiz-wrap').style.setProperty('--quiz-accent', d.accent) } catch (e) {} }
    if (d.bg) { try { document.querySelector('.quiz-wrap').style.setProperty('--quiz-bg', d.bg) } catch (e) {} }
    spec = d.spec || { steps: [] }
    steps = Array.isArray(spec.steps) ? spec.steps : []
    if (d.theme) theme = d.theme
    if (typeof d.goToStep === 'number') state.i = Math.max(0, Math.min(d.goToStep, steps.length - 1))
    state.score = 0; state.answers = {}
    render()
  })

  render()

  // Handshake with the dashboard builder: announce readiness so it replies with
  // the current working spec (onLoad+setTimeout on the parent side is racy —
  // same pattern as the funnel editor's `funnel-preview-ready`).
  if (preview || edit) {
    try { window.parent.postMessage({ type: 'quiz-preview-ready' }, '*') } catch (e) {}
  }
})()
</script>
