<style>
:root{
  --verde:#16a34a; --verde-btn:#17a34a; --verde-hover:#15803d; --verde-sombra:#107536;
  --verde-suave:rgba(22,163,74,.10); --verde-borde:rgba(22,163,74,.5);
  --tinta:#030712; --gris:#6b7280; --gris2:#3f3f46; --linea:#e5e7eb;
  --rojo:#dc2626; --papel:#fff;
  --fuente:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--fuente);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}

.wrap{max-width:28rem;margin:0 auto;padding:12px 12px 48px}
/* ── cabecera ───────────────────────────────────────────── */
.top{position:relative;padding-top:6px}
.volver{position:absolute;left:0;top:2px;width:40px;height:40px;border:0;background:none;cursor:pointer;color:#111;display:grid;place-items:center;border-radius:50%;z-index:3}
.volver svg{width:22px;height:22px}
.volver.off{visibility:hidden;pointer-events:none}
.marca{display:flex;justify-content:center;align-items:center;min-height:58px}
.marca img{max-height:96px;width:auto}
.barra{height:8px;border-radius:99px;background:#dcfce7;overflow:hidden;margin:14px 0 4px}
.barra i{display:block;height:100%;width:0;background:var(--verde);border-radius:99px;transition:width .45s ease}

/* ── bloques ────────────────────────────────────────────── */
.paso{padding-top:14px;animation:ent .3s ease both}
@keyframes ent{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.paso{animation:none}.barra i{transition:none}}
.tx{margin:0 0 14px}
.tx h2{font-size:1.45rem;line-height:1.22;font-weight:800;margin:0 0 6px;text-align:center;text-wrap:balance}
.tx h3{font-size:1.18rem;line-height:1.28;font-weight:800;margin:0 0 6px;text-align:center;text-wrap:balance}
.tx p{margin:6px 0;color:var(--gris);text-align:center}
.tx p b,.tx p strong{color:var(--tinta)}
.tx .v{color:var(--verde)}
.tx .r{color:var(--rojo)}
.tx .neg{background:#09090b;color:#fff;padding:0 4px;border-radius:3px}
.tx .sub{text-decoration:underline}
.tx.izq p,.tx.izq li{text-align:left}
.gap{height:2rem}.gap1{height:1rem}.gap3{height:3rem}

/* ── botones ────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:56px;
  padding:10px 16px;border:0;border-radius:16px;background:var(--verde-btn);color:#fff;font-size:1rem;font-weight:500;
  cursor:pointer;box-shadow:0 4px 0 var(--verde-sombra);transition:transform .1s ease,box-shadow .1s ease;text-decoration:none;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--verde-sombra)}
.btn+.btn{margin-top:16px}
.btn.pulso{animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:none}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.btn.pulso{animation:none}}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:0 4px 0 var(--verde-sombra)}

/* ── opciones ───────────────────────────────────────────── */
.ops{display:grid;gap:12px;margin:0 0 6px}
.ops.g2{grid-template-columns:1fr 1fr}
.op{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px;
  border:1px solid var(--verde-borde);border-radius:16px;background:var(--verde-suave);color:var(--tinta);
  font-size:1rem;text-align:left;cursor:pointer;transition:background .15s ease,transform .1s ease}
.op:active{transform:scale(.99)}
.op.on{background:rgba(22,163,74,.24);border-color:var(--verde);font-weight:600}
.op .emo{font-size:1.5rem;line-height:1;flex:0 0 auto}
.op .lb{flex:1}
.op .ck{flex:0 0 auto;width:22px;height:22px;border:1px solid #9ca3af;border-radius:6px;background:#fff;display:grid;place-items:center}
.op.on .ck{background:var(--verde);border-color:var(--verde)}
.op .ck svg{width:14px;height:14px;opacity:0;color:#fff}
.op.on .ck svg{opacity:1}
.op .fl{flex:0 0 auto;width:28px;height:28px;border:1px solid #d4d4d8;border-radius:50%;display:grid;place-items:center;background:#fff;color:#52525b}
.op .fl svg{width:13px;height:13px}
/* opciones con foto (género) */
.op.foto{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;background:#fff;border:1px solid var(--linea);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.op.foto .ph{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
.op.foto .ph img{width:100%;height:100%;object-fit:contain}
.op.foto .pie{display:flex;align-items:center;gap:10px;padding:12px}
.op.foto .pie .lb{font-size:1rem}

/* ── lámina de síntomas ─────────────────────────────────── */
.lam{position:relative;width:100%;aspect-ratio:1000/730;container-type:inline-size;margin:6px 0 4px}
.lam>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bub{position:absolute;background:#ff751f;color:#fff;font-weight:700;border-radius:14px;
  padding:1.6cqw 2.6cqw;font-size:3.05cqw;line-height:1.18;text-align:center;display:grid;place-items:center}

/* ── audio estilo WhatsApp ──────────────────────────────── */
.wa{background:#efe7dd;border-radius:14px;padding:14px 12px}
.wab{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wab .pl{flex:0 0 auto;width:30px;height:30px;border:0;background:none;cursor:pointer;color:#54656f;display:grid;place-items:center}
.wab .pl svg{width:22px;height:22px}
.wa-mid{flex:1;min-width:0}
.wa-tr{position:relative;height:22px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wa-tr b{display:block;flex:1 1 auto;background:#c8d1d6;border-radius:2px;min-width:2px}
.wa-tr b.hecho{background:#53bdeb}
.wa-time{font-size:.72rem;color:#667781;margin-top:3px}
.wa-av{flex:0 0 auto;position:relative;width:46px;height:46px}
.wa-av img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#fff}
.wa-av i{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:#53bdeb;display:grid;place-items:center;color:#fff}
.wa-av i svg{width:11px;height:11px}

/* ── video ──────────────────────────────────────────────── */
.vid{border-radius:16px;overflow:hidden;background:#000;max-width:300px;margin:0 auto}
.vid video{width:100%;height:auto;display:block}
.vid-nota{font-size:.75rem;color:#9ca3af;text-align:center;margin:6px 0 0}

/* ── reseñas ────────────────────────────────────────────── */
.res{border:1px solid var(--linea);border-radius:16px;padding:14px;background:#fff}
.res+.res{margin-top:12px}
.res-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.res-top img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.res-top b{display:block;font-size:.98rem}
.res-top span{display:block;font-size:.8rem;color:var(--gris)}
.res p{margin:0;color:var(--gris2);font-size:.95rem}
.res .est{color:#f59e0b;letter-spacing:1px;font-size:.85rem;margin-top:8px}

/* ── notificación ───────────────────────────────────────── */
.nota{border-radius:16px;padding:14px;border:1px solid var(--linea);background:#fff}
.nota.ok{background:#f0fdf4;border-color:var(--verde-borde)}
.nota b{display:block;margin-bottom:4px}
.nota p{margin:0;font-size:.95rem}

/* ── métricas ───────────────────────────────────────────── */
.met{margin:0 0 16px}
.met-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-weight:700;font-size:.97rem;line-height:1.25}
.met-t{position:relative;height:8px;border-radius:99px;background:var(--linea);margin-top:7px}
.met-t i{position:absolute;left:0;top:0;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.met-t u{position:absolute;top:50%;width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid #d4d4d8;
  transform:translate(-50%,-50%);box-shadow:0 1px 2px rgba(0,0,0,.18);left:0;transition:left .9s ease}
.met.rojo .met-t i{background:var(--rojo)} .met.verde .met-t i{background:var(--verde)}

/* ── carga ──────────────────────────────────────────────── */
.carga{margin:0 0 20px}
.carga-h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.carga-t{height:8px;border-radius:99px;background:var(--linea);overflow:hidden}
.carga-t i{display:block;height:100%;width:0;background:var(--verde);border-radius:99px}

/* ── carrusel ───────────────────────────────────────────── */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 86%;scroll-snap-align:center}
.pts{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pts i{width:7px;height:7px;border-radius:50%;background:#d4d4d8}
.pts i.on{background:var(--verde)}

/* ── chat de WhatsApp dibujado ──────────────────────────── */
.chat{border:1px solid var(--linea);border-radius:16px;overflow:hidden;background:#efe7dd}
.chat-h{display:flex;align-items:center;gap:8px;background:#075e54;color:#fff;padding:9px 12px}
.chat-h .av{width:30px;height:30px;border-radius:50%;background:#cfd8dc;display:grid;place-items:center;color:#075e54;font-weight:700;font-size:.85rem}
.chat-h b{font-size:.92rem;font-weight:600;display:block;line-height:1.1}
.chat-h span{font-size:.7rem;opacity:.8}
.chat-b{padding:10px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:82%;padding:7px 9px;border-radius:9px;font-size:.84rem;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative}
.msg.ellos{align-self:flex-start;background:#fff}
.msg.yo{align-self:flex-end;background:#dcf8c6}
.msg em{display:block;font-style:normal;font-size:.63rem;color:#667781;text-align:right;margin-top:2px}

/* ── tabla comparativa ──────────────────────────────────── */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid #1e3a8a;border-radius:12px;padding:8px;background:#fff;align-items:stretch}
.vs-cab{border:2px solid #1e3a8a;border-radius:10px;padding:12px 8px;text-align:center;min-height:104px;display:grid;place-content:center;gap:6px}
.vs-cab .ic{font-size:1.5rem;line-height:1}
.vs-cab b{font-size:1.18rem;color:#1e3a8a;line-height:1.1}
.vs-cab b .v{color:var(--verde)}
.vs-it{display:flex;align-items:center;gap:7px;border:2px solid #1e3a8a;border-radius:10px;padding:8px 7px;font-size:.78rem;line-height:1.2;min-height:50px}
.vs-it span{flex:0 0 auto;font-size:1rem}

/* ── nota de divulgación ────────────────────────────────── */
.nt{border:1px solid var(--linea);border-radius:16px;overflow:hidden;background:#fff}
.nt-h{background:#f4f4f5;padding:8px 12px;font-size:.68rem;letter-spacing:.14em;font-weight:700;color:#52525b;border-bottom:1px solid var(--linea)}
.nt-b{padding:14px}
.nt-b h4{margin:0 0 8px;font-size:1.06rem;line-height:1.25}
.nt-b img{border-radius:10px;margin:10px 0}
.nt-b p{margin:8px 0;font-size:.9rem;color:var(--gris2)}
.nt-b .pie{font-size:.72rem;color:#9ca3af;margin-top:10px}

/* ── antes / después ────────────────────────────────────── */
.ad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ad-c{border:1px solid var(--linea);border-radius:16px;overflow:hidden;background:#fff}
.ad-c h5{margin:0;padding:10px;text-align:center;font-size:1.05rem;border-bottom:1px solid var(--linea)}
.ad-p{text-align:center;font-weight:700;font-size:.92rem;margin:10px 2px 0;line-height:1.25}

/* ── oferta ─────────────────────────────────────────────── */
.placa{background:var(--verde);border-radius:18px;padding:22px 16px;text-align:center;color:#fff;box-shadow:0 6px 0 var(--verde-sombra);position:relative}
.placa b{display:block;font-size:1.5rem;line-height:1.2}
.placa span{display:inline-block;margin-top:8px;background:#e9d5ff;color:#111;font-size:1.3rem;font-weight:700;padding:2px 10px;border-radius:4px}
.placa i{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:#2563eb;border:3px solid #93c5fd;display:grid;place-items:center;color:#fff}
.stack{display:grid;gap:10px}
.stack .it{border:1px solid var(--linea);border-radius:14px;padding:13px 12px;background:#fff;font-size:.95rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.precio{text-align:center;margin:18px 0}
.precio .tach{color:var(--rojo);font-weight:800;font-size:1.35rem;text-decoration:line-through}
.precio .por{color:var(--verde);font-weight:800;font-size:1.3rem;margin-top:2px}
.precio .num{color:var(--verde);font-weight:800;font-size:2.4rem;line-height:1.1;margin-top:2px}
.precio .cuo{color:var(--gris);font-size:.92rem;margin-top:8px}
.caja-precio{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--verde);border-radius:16px;padding:14px;background:#fff;cursor:pointer}
.caja-precio b{font-size:1.05rem;line-height:1.35}
.caja-precio .chip{background:#f4f4f5;border-radius:10px;padding:8px 10px;text-align:center;flex:0 0 auto}
.caja-precio .chip small{display:block;font-size:.72rem;color:var(--gris)}
.caja-precio .chip span{font-size:1.25rem;font-weight:800}
.conf{text-align:center;margin:14px 0}
.conf b{display:block}
.conf span{color:var(--gris);font-size:.92rem}
.gar{background:linear-gradient(135deg,#4a2f06,#b88a2b 55%,#f0d788);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;color:#fff}
.gar .sello{flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fde68a,#b45309);border:3px solid #fde68a;display:grid;place-items:center;text-align:center;line-height:1;color:#3b2306}

function slotVideo(n){ return estado.genero + "_" + n; }

function bloque(b, idx){
  switch (b.t){
    case "tx":   return '<div class="tx' + (b.izq ? " izq" : "") + '">' + b.h + '</div>';
    case "html": return b.h.replace(/\[\[IMG:([a-z_]+)\|([^\]]*)\]\]/g, function(_, k, alt){ return IMGTAG(k, alt); });
    case "img":  return IMGTAG(b.k, "", b.est ? ' style="' + b.est + '"' : "");
    case "lam":  return lamina(estado.genero);
    case "gap":  return '<div class="gap"></div>';
    case "gap1": return '<div class="gap1"></div>';
    case "gap3": return '<div class="gap3"></div>';
    case "btn":  return '<button class="btn' + (b.pulso ? " pulso" : "") + '" type="button" data-act="' +
                   (b.next ? "next" : "avanzar") + '">' + b.l + '</button>';
    case "cta":  return '<button class="btn pulso js-cta" type="button" data-act="checkout">' + b.l + '</button>';
    case "wa":   return wa(b.k);
    case "video":return video(slotVideo(b.slot));
    case "res":  return resena(R[typeof b.r === "string" ? b.r : b.r[estado.genero]]);
    case "nota": return '<div class="nota' + (b.ok ? " ok" : "") + '"><b>' + b.tit + '</b><p>' + b.txt + '</p></div>';
    case "car":  return '<div class="car" id="car">' + chat(CHATS[0]) + chat(CHATS[1]) + '</div><div class="pts" id="pts"><i class="on"></i><i></i></div>';
    case "ops":  return ops(b, idx);
    case "met":  return b.items.map(function(m){
                   return '<div class="met ' + m[2] + '"><div class="met-h"><span>' + m[0] + '</span><span>' + m[1] + '%</span></div>' +
                          '<div class="met-t" data-pct="' + m[1] + '"><i></i><u></u></div></div>';
                 }).join("");
    case "carga":return b.items.map(function(c, j){
                   return '<div class="carga"><div class="carga-h"><span>' + c[0] + '</span><span class="pc">0%</span></div>' +
                          '<div class="carga-t" data-seg="' + c[1] + '"><i></i></div></div>';
                 }).join("");
    case "antes":
      var g = estado.genero;
      return '<div class="ad">' +
        '<div class="ad-c"><h5>Antes</h5>' + IMGTAG("antes_" + g, "Antes") + '</div>' +

        '</div>';
    case "precio":
      return '<div class="precio"><div class="tach">Valor total: $' + P.PRECIO_TACHADO + '</div>' +
        '<div class="por">Por apenas</div><div class="num">$' + P.PRECIO + '</div>' +

        '<p class="cuo">o hasta <b>' + P.CUOTAS + ' cuotas de $' + P.CUOTA + '</b> con Mercado Pago</p></div>';

function ops(b, idx){
  var h = '<div class="ops' + (b.g2 ? " g2" : "") + '" data-ops="' + idx + '"' + (b.multi ? ' data-multi="1"' : "") + '>';
  for (var i = 0; i < b.items.length; i++){
    var o = b.items[i];
    if (b.foto){
      h += '<button class="op foto" type="button" data-act="choose" data-i="' + i + '"' +
           (o.genero ? ' data-genero="' + o.genero + '"' : "") + '>' +
           '<span class="ph">' + IMGTAG(o.k, o.l) + '</span>' +
           '<span class="pie"><span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span><span class="lb">' + o.l + '</span></span></button>';
    } else {
      h += '<button class="op" type="button" data-act="' + (b.multi ? "toggle" : "choose") + '" data-i="' + i + '">' +
           (o.e ? '<span class="emo">' + o.e + '</span>' : "") +
           '<span class="lb">' + o.l + '</span>' +
           (b.multi
             ? '<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>'
             : (b.flecha ? '<span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>' : "")) +
           '</button>';
    }
  }
  return h + "</div>";
}

/* progreso: solo las pantallas de PREGUNTA */
function progreso(){
  var total = 0, pos = 0;
  for (var k = 0; k < PASOS.length; k++){
    if (!PASOS[k].preg) continue;
    total++;
    if (k <= estado.i) pos++;
  }
  var p = PASOS[estado.i];
  if (!p.preg && estado.i > 1 && pos > 0) { /* mantiene el último valor */ }
  return total ? Math.min(100, Math.round(pos / total * 100)) : 100;
}

var timers = [];
function limpiarTimers(){ timers.forEach(function(t){ clearInterval(t); clearTimeout(t); }); timers = []; }

function ir(i, guardar){
  if (i < 0 || i >= PASOS.length) return;
  limpiarTimers();
  estado.i = i;
  var p = PASOS[i], h = "";
  for (var j = 0; j < p.b.length; j++) h += bloque(p.b[j], j);
  app.innerHTML = h;

  /* cabecera */
  marca.innerHTML = (p.logo === false) ? "" : IMGTAG("logo", "Protocolo Desparasitación Articular");
  var mostrarBarra = (p.barra !== false) && i > 0;
  barra.hidden = !mostrarBarra;
  if (mostrarBarra) barra.firstChild.style.width = progreso() + "%";
  volver.className = "volver" + ((i === 0 || p.volver === false) ? " off" : "");

  window.scrollTo(0, 0);
  activar(p);
  ligarCTAs();
  if (p.oferta) prueba_social(true); else prueba_social(false);
}

    }
  }); });

  /* cargas encadenadas */
  var cargas = app.querySelectorAll(".carga-t");
  if (cargas.length){
    var total = 0;
    for (var c = 0; c < cargas.length; c++) total += +cargas[c].getAttribute("data-seg");
    (function corre(n){
      if (n >= cargas.length){ timers.push(setTimeout(function(){ ir(estado.i + 1, true); }, 350)); return; }
      var el = cargas[n], seg = +el.getAttribute("data-seg") * 1000, t0 = Date.now(),
          pc = el.parentNode.querySelector(".pc"), it = el.querySelector("i");
      var iv = setInterval(function(){
        if (!document.body.contains(el)) { clearInterval(iv); return; }
        var f = Math.min(1, (Date.now() - t0) / seg);
        it.style.width = (f * 100) + "%";
        if (pc) pc.textContent = Math.round(f * 100) + "%";
        if (f >= 1){ clearInterval(iv); corre(n + 1); }
      }, 60);
      timers.push(iv);
    })(0);
  }

  /* carrusel: puntos */
  var car = app.querySelector("#car"), pts = app.querySelector("#pts");
  if (car && pts) car.addEventListener("scroll", function(){
    var k = Math.round(car.scrollLeft / car.clientWidth);
    for (var i = 0; i < pts.children.length; i++) pts.children[i].className = (i === k ? "on" : "");
  });

  /* audio de WhatsApp */
  var reps = app.querySelectorAll(".wab");
  for (var a = 0; a < reps.length; a++) (function(box){
    var au = box.querySelector("audio"), bt = box.querySelector(".pl"),
        tr = box.querySelector(".wa-tr"), tm = box.querySelector(".wa-time");
    if (!au.getAttribute("src")) au.src = au.getAttribute("data-src");
    var barras = tr.querySelectorAll("b");
    function pinta(){
      var d = au.duration || 0, f = d ? au.currentTime / d : 0, n = Math.floor(f * barras.length);
      for (var i = 0; i < barras.length; i++) barras[i].className = (i < n ? "hecho" : "");
      var s = Math.floor(au.currentTime || 0);
      tm.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
    }
    au.addEventListener("timeupdate", pinta);
    au.addEventListener("loadedmetadata", function(){
      var s = Math.floor(au.duration || 0);
      tm.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
    });
    function icono(){
      bt.innerHTML = au.paused
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    }
    au.addEventListener("play", icono); au.addEventListener("pause", icono); au.addEventListener("ended", icono);
    bt.addEventListener("click", function(){ if (au.paused) au.play().catch(function(){}); else au.pause(); });
    /* intenta arrancar solo: hubo clic antes, así que el navegador suele dejar */
    au.play().catch(function(){});
  })(reps[a]);
}

/* ═══ 8. clics ════════════════════════════════════════════ */
app.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");

  if (act === "checkout"){
    try { fbq("track", "AddToCart"); } catch(e){}
    window.location.href = checkoutHref();
    return;
  }
  if (act === "avanzar"){ ir(estado.i + 1, true); return; }
  if (act === "choose"){
    var g = el.getAttribute("data-genero");
    if (g) estado.genero = g;
    el.classList.add("on");
    setTimeout(function(){ ir(estado.i + 1, true); }, 150);
    return;
  }
  if (act === "toggle"){ el.classList.toggle("on"); return; }
  if (act === "next"){
    var caja = app.querySelector("[data-multi]");
    if (caja && !caja.querySelector(".op.on")){
      caja.animate([{transform:"translateX(0)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}], {duration:240});
      return;
    }
    ir(estado.i + 1, true);
  }
});
volver.addEventListener("click", function(){ if (estado.i > 0) ir(estado.i - 1, true); });

/* ═══ 9. CTAs al checkout — un solo lugar, idempotente ════ */
function ligarCTAs(){
  var sel = document.querySelectorAll("a.btn, button.btn.js-cta, [data-cta], [data-act=checkout]");
  for (var i = 0; i < sel.length; i++){
    var e = sel[i];
    if (e.getAttribute("data-ligado")) continue;
    e.setAttribute("data-ligado", "1");
    if (e.tagName === "A"){ e.setAttribute("href", checkoutHref()); e.setAttribute("rel", "noopener"); continue; }
    if (e.hasAttribute("data-cta") && e.getAttribute("data-act") !== "checkout"){
      e.style.cursor = "pointer";
      e.addEventListener("click", function(){
        try { fbq("track", "AddToCart"); } catch(err){}
        window.location.href = checkoutHref();
      });
    }
  }
}
