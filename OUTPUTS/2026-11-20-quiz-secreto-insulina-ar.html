<style>
:root{
  --background:30 60% 97%; --foreground:25 40% 18%;
  --card:0 0% 100%; --primary:25 100% 50%; --primary-foreground:0 0% 100%;
  --secondary:37 100% 85%; --muted:35 50% 93%; --muted-foreground:25 25% 45%;
  --accent:45 100% 65%; --destructive:0 84.2% 60.2%;
  --coral:25 100% 50%; --pessego:37 100% 85%; --bege:30 40% 88%;
  --btn-green:145 63% 42%; --btn-green-hover:145 63% 36%;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:hsl(var(--background));color:hsl(var(--foreground));
  font-family:Poppins,system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}

#app{height:100dvh;display:flex;flex-direction:column;max-width:32rem;margin:0 auto;
  overflow:hidden;background:hsl(var(--background))}
#sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── encabezado ─────────────────────────────────────────── */
#hd{flex-shrink:0;padding:.75rem 1rem .5rem;background:hsl(var(--background));display:none}
#hd.on{display:block}
.hd-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
#volver{padding:.25rem;margin-left:-.25rem;color:hsl(var(--muted-foreground));line-height:0}
#hd img{height:2.75rem;object-fit:contain;width:auto}
.progress-bar-track{height:.5rem;width:100%;border-radius:9999px;background:hsl(var(--bege))}
.progress-bar-fill{height:100%;border-radius:9999px;transition:all .5s cubic-bezier(0,0,.2,1);
  background:linear-gradient(90deg,hsl(var(--coral)),hsl(var(--accent)))}

/* ── componentes del quiz ───────────────────────────────── */
.quiz-option{width:100%;cursor:pointer;border-radius:.75rem;border:2px solid hsl(var(--bege));
  padding:1rem;text-align:left;transition:all .2s cubic-bezier(.4,0,.2,1);background:hsl(var(--card))}
.quiz-option:hover{border-color:hsl(var(--coral));background:hsl(var(--pessego)/.3)}
.quiz-option.selected{border-color:hsl(var(--coral));background:hsl(var(--pessego)/.6);
  box-shadow:0 0 0 3px hsl(var(--coral)/.3);font-weight:700}
.btn-quiz{width:100%;border-radius:1rem;padding:1rem 1.5rem;font-size:1.125rem;line-height:1.75rem;
  font-weight:700;transition:all .3s cubic-bezier(.4,0,.2,1);background:hsl(var(--coral));
  color:hsl(var(--primary-foreground));box-shadow:0 4px 15px hsl(var(--coral)/.3)}
.btn-quiz:hover{transform:scale(1.02);box-shadow:0 6px 20px hsl(var(--coral)/.4)}
.btn-quiz:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-quiz-green{width:100%;border-radius:1rem;padding:1rem 1.5rem;font-size:1.125rem;line-height:1.75rem;
  font-weight:700;transition:all .3s cubic-bezier(.4,0,.2,1);background:hsl(var(--btn-green));
  color:#fff;box-shadow:0 4px 15px hsl(var(--btn-green)/.4);animation:pulse-scale 2s ease-in-out infinite;
  display:block;text-align:center;text-decoration:none}
.btn-quiz-green:hover{background:hsl(var(--btn-green-hover));transform:scale(1.02)}
.btn-quiz-green:disabled{opacity:.5;animation:none;cursor:not-allowed}
.gradient-text{color:hsl(var(--coral));font-weight:800}
@keyframes pulse-scale{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes bounce-horizontal{0%,100%{transform:translate(0)}50%{transform:translate(6px)}}
@keyframes bounce-vertical{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bounce-soft{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulso-suave{0%,100%{opacity:1}50%{opacity:.5}}
.anim-bh{animation:bounce-horizontal 1s ease-in-out infinite}
.anim-bv{animation:bounce-vertical 1s ease-in-out infinite}
.anim-bs{animation:bounce-soft .8s ease-in-out infinite}
.anim-fade{animation:fade-in .35s ease-out}
.anim-pulse{animation:pulso-suave 2s ease-in-out infinite}

/* ── utilidades (equivalentes a las clases del original) ── */
.pg{padding:2rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.col{display:flex;flex-direction:column}
.center{align-items:center;text-align:center}
.g2{gap:.5rem}.g3{gap:.75rem}.g4{gap:1rem}.g5{gap:1.25rem}.g6{gap:1.5rem}
.h2{font-size:1.5rem;font-weight:700;text-align:center;line-height:1.3;margin:0}
.h2x{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.3;margin:0}
.h2s{font-size:1.25rem;font-weight:700;text-align:center;line-height:1.4;margin:0}
.sub{font-size:.875rem;color:hsl(var(--muted-foreground));text-align:center;margin:0}
.muted{color:hsl(var(--muted-foreground))}
.card{background:hsl(var(--card));border:1px solid hsl(var(--bege));border-radius:1rem}
.emo{font-size:1.5rem;line-height:1}
.op-row{display:flex;align-items:center;gap:.75rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}

/* paso 1 — portada */
.portada{display:flex;flex-direction:column;height:100%;background:#FFF5EB;overflow:hidden}
.portada .logo{display:flex;justify-content:center;padding:.75rem 0 .25rem;flex-shrink:0}
.portada .logo img{height:2.5rem;width:auto;object-fit:contain}
.portada .body{padding:0 1rem .75rem;display:flex;flex-direction:column;gap:.375rem;flex:1;min-height:0}
.portada h1{text-align:center;font-size:20px;line-height:1.1;font-weight:900;flex-shrink:0;margin:0}
.portada .claim{text-align:center;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.25;
  padding:0 .5rem;flex-shrink:0;margin:0}
.foto-wrap{position:relative;flex:1;min-height:0}
.foto-wrap .glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:85%;height:80%;
  border-radius:9999px;pointer-events:none;
  background:radial-gradient(circle,rgba(255,170,60,.28) 0%,rgba(255,170,60,0) 68%)}
.foto-wrap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;
  filter:drop-shadow(0 10px 18px rgba(120,70,10,.22))}
.chip-med{position:absolute;left:.25rem;top:.25rem;background:rgba(255,255,255,.9);
  backdrop-filter:blur(4px);border-radius:9999px;padding:.25rem .75rem .25rem .375rem;
  box-shadow:0 4px 6px -1px rgba(0,0,0,.1);display:flex;align-items:center;gap:.375rem;z-index:10}
.chip-med .t1{font-size:11px;font-weight:900;line-height:1}
.chip-med .t2{font-size:8px;font-weight:600;letter-spacing:.05em;color:hsl(var(--muted-foreground));line-height:1.2}
.chip-prc{position:absolute;right:.5rem;top:52%;background:hsl(var(--coral));color:#fff;font-size:11px;
  font-weight:900;padding:.25rem .625rem;border-radius:9999px;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);
  outline:2px solid #FFF5EB;z-index:10;white-space:nowrap}
.social{text-align:center;font-size:11px;color:hsl(var(--muted-foreground));line-height:1.375;flex-shrink:0}
.social strong{color:hsl(var(--btn-green))}
.chips{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:10px;
  color:hsl(var(--muted-foreground));flex-wrap:wrap;flex-shrink:0}
.chips i{font-style:normal;color:hsl(var(--btn-green))}
.portada .btn-quiz-green{font-size:.875rem;flex-shrink:0}

/* paso 4 — zonas */
.zonas{display:flex;gap:.75rem;align-items:stretch}
.zonas .ph{width:42%;flex-shrink:0;position:relative}
.zonas .ph img{width:100%;height:100%;border-radius:.5rem;object-fit:cover}
.zonas .ops{flex:1;display:flex;flex-direction:column;gap:.5rem}
.zonas .quiz-option{padding:.5rem;font-size:.875rem;display:flex;align-items:center;gap:.5rem}
.zonas .emo{font-size:1rem}

/* paso 5 — estadística */
.stat{background:hsl(var(--card));border-radius:1rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.08);
  border:1px solid hsl(var(--bege));padding:1.25rem 1.5rem;width:100%;max-width:24rem}
.stat .n{font-size:3rem;font-weight:900;color:hsl(var(--coral));line-height:1;margin-bottom:.25rem}

/* paso 6 — nota de divulgación */
.nota{width:100%;border:1px solid hsl(var(--bege));border-radius:1rem;overflow:hidden;
  background:hsl(var(--card));box-shadow:0 4px 6px -1px rgba(0,0,0,.08)}
.nota .vol{background:#B91C1C;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;
  padding:.5rem .875rem}
.nota .in{padding:1rem .875rem}
.nota h3{font-size:1.0625rem;line-height:1.3;font-weight:800;margin:0 0 .5rem}
.nota .firma{font-size:11px;color:hsl(var(--muted-foreground));margin:0 0 .75rem}
.nota .ph{position:relative;border-radius:.625rem;overflow:hidden;background:#000}
.nota .ph img{width:100%;height:230px;object-fit:cover;object-position:center 18%}
.nota .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(185,28,28,.92);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.02em;padding:.5rem .625rem;line-height:1.3}
.nota p.tx{font-size:.8125rem;line-height:1.6;color:hsl(var(--muted-foreground));margin:.75rem 0 0}
.nota .pie{font-size:10px;color:hsl(var(--muted-foreground));border-top:1px solid hsl(var(--bege));
  padding:.5rem .875rem;margin:0}

/* paso 7 — nombre */
#nombre{width:100%;text-align:center;font-size:1.25rem;font-weight:700;padding:1rem;
  border:2px solid hsl(var(--bege));border-radius:.75rem;background:hsl(var(--background));outline:none}
#nombre:focus{border-color:hsl(var(--coral))}

/* paso 15 — tarjetas del mecanismo */
.tick{display:flex;align-items:center;gap:.75rem;border-radius:.75rem;border:1px solid #86EFAC;
  background:#F0FDF4;padding:1rem}
.tick b{color:#16A34A;font-size:1.125rem}
.tick span{font-size:.875rem;font-weight:600}
.mec{position:relative;border:1px solid hsl(var(--bege));border-radius:1rem;padding:1.25rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;
  box-shadow:0 4px 6px -1px rgba(0,0,0,.08);background:hsl(var(--card))}
.mec .num{position:absolute;top:-.75rem;right:-.5rem;width:2.25rem;height:2.25rem;border-radius:9999px;
  background:hsl(var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.875rem;box-shadow:0 10px 15px -3px rgba(0,0,0,.2)}
.mec .t{font-weight:700;font-size:.875rem;line-height:1.2}
.mec .d{font-size:.75rem;color:hsl(var(--muted-foreground));line-height:1.6}

/* pasos 16-18 — medidores */
.big{font-size:3.75rem;font-weight:900;color:hsl(var(--coral));line-height:1}
.big span{font-size:1.5rem;font-weight:700;margin-left:.25rem}
.pm{display:flex;gap:.75rem}
.pm button{width:3.5rem;height:3.5rem;border-radius:9999px;border:2px solid hsl(var(--bege));
  font-weight:700;font-size:1.125rem;transition:background .2s}
.pm button:hover{background:hsl(var(--muted))}
.meta-pill{background:hsl(var(--btn-green)/.1);color:hsl(var(--btn-green));font-weight:700;
  padding:.5rem 1rem;border-radius:9999px;font-size:.875rem}
.regla{width:100%;max-width:22rem;height:2.5rem;position:relative;margin-top:-.5rem}
.regla .tk{position:absolute;bottom:0;width:1px;background:hsl(var(--bege))}

/* paso 21 — gráfico */
.verde{background:#DCFCE7;border:1px solid #86EFAC;border-radius:1rem;padding:1.25rem;width:100%}
.chart{width:100%;background:hsl(var(--card));border:1px solid hsl(var(--bege));border-radius:1rem;padding:1rem}
.chart .lbl{font-size:.75rem;font-weight:700;color:hsl(var(--muted-foreground));margin:0 0 .75rem;
  text-transform:uppercase;letter-spacing:.05em}
.chart .box{position:relative;width:100%;height:180px}
.chart svg{width:100%;height:100%;display:block}
.dot{width:.75rem;height:.75rem;border-radius:9999px}

/* paso 22 — compromiso */
.cmp{position:relative;width:100%;display:flex;justify-content:center}
.cmp img{width:100%;max-width:20rem;border-radius:1rem}
.cmp .fl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cmp .fl div{width:2.5rem;height:2.5rem;border-radius:9999px;background:hsl(var(--coral));
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px -3px rgba(0,0,0,.2)}
.pill-cta{background:hsl(var(--coral));border-radius:9999px;padding:.375rem 1rem;display:flex;
  align-items:center;justify-content:center;gap:.375rem}
.pill-cta span{color:#fff;font-weight:700;font-size:11px;letter-spacing:.03em}

/* paso 24 — carga */
.ld{border-radius:.75rem;border:1px solid hsl(var(--bege)/.4);background:hsl(var(--muted)/.3);
  padding:1rem;opacity:.5;transition:all .5s}
.ld.act{border-color:hsl(var(--coral)/.6);background:hsl(var(--coral)/.1);opacity:1;
  box-shadow:0 4px 6px -1px hsl(var(--coral)/.1)}
.ld.ok{border-color:hsl(var(--coral)/.4);background:hsl(var(--coral)/.05);opacity:1}
.ld .barra{margin-top:.5rem;height:.375rem;border-radius:9999px;background:hsl(var(--muted));overflow:hidden}
.ld .barra i{display:block;height:100%;border-radius:9999px;
  background:linear-gradient(90deg,hsl(var(--coral)),hsl(var(--coral)/.7));transition:width .1s linear}

/* paso 25 — análisis */
.imc{border-radius:1rem;overflow:hidden;border:1px solid hsl(var(--bege))}
.imc .top{height:6px;background:hsl(var(--coral))}
.imc .in{padding:1.25rem;display:flex;flex-direction:column;align-items:center;gap:1rem;background:hsl(var(--card))}
.imc .n{font-size:3rem;font-weight:900;color:hsl(var(--coral));line-height:1}
.alerta{display:flex;align-items:center;gap:.5rem;font-size:.875rem}
.benef{display:flex;align-items:center;gap:.75rem;background:hsl(var(--secondary)/.5);
  border-radius:.75rem;padding:.75rem 1rem;font-size:.875rem;font-weight:500}
.diag{background:hsl(var(--btn-green)/.1);border-radius:.75rem;padding:1rem;text-align:center;
  font-size:.875rem;font-weight:500;color:hsl(var(--btn-green))}
.ilustra{font-size:10px;color:hsl(var(--muted-foreground));text-align:center;margin:0}

/* paso 28 — oferta */
.urg{background:hsl(var(--coral));color:#fff;text-align:center;padding:.5rem;font-size:.875rem;
  font-weight:700;position:sticky;top:0;z-index:10}
.caja{border-radius:1rem;overflow:hidden;border:1px solid hsl(var(--bege));
  box-shadow:0 1px 3px rgba(0,0,0,.08);background:hsl(var(--card))}
.caja .hd{background:hsl(var(--coral));color:#fff;padding:1rem;text-align:center}
.caja .hd .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.caja .hd .v{font-size:1.125rem;font-weight:700;margin-top:.25rem}
.dia{display:flex;align-items:center;gap:.75rem;border:1px solid hsl(var(--bege));
  border-radius:.75rem;padding:.75rem}
.dia .k{font-size:.75rem;text-transform:uppercase;font-weight:700;color:hsl(var(--coral))}
.dia .v{font-weight:700;font-size:.875rem}
.meta-tag{background:hsl(var(--btn-green));color:#fff;font-size:.75rem;padding:.25rem .5rem;
  border-radius:.25rem;font-weight:700}
.bono{border-radius:.75rem;border:1px solid hsl(var(--bege));background:hsl(var(--secondary)/.4);
  padding:1rem;display:flex;gap:.75rem}
.inc{display:flex;align-items:flex-start;gap:.5rem;font-size:.875rem}
.precio{border-top:1px solid hsl(var(--bege));margin-top:.75rem;padding-top:1rem;text-align:center}
.precio .tach{color:hsl(var(--muted-foreground));text-decoration:line-through;font-size:1rem}
.precio .por{font-size:.75rem;color:hsl(var(--muted-foreground));margin-top:.5rem}
.precio .hoy{font-size:3rem;font-weight:900;color:hsl(var(--btn-green));line-height:1;margin-top:.25rem}
.precio .cuo{font-size:.875rem;color:hsl(var(--muted-foreground));margin-top:.5rem}
.gar{border-radius:1rem;padding:1.25rem;text-align:center;border:2px solid hsl(var(--coral));
  background:hsl(var(--secondary))}
.gar .sello{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;
  border-radius:9999px;background:hsl(var(--coral));color:#fff;font-weight:900;font-size:.75rem;
  line-height:1.2;margin-bottom:.75rem}
.faq{border-bottom:1px solid hsl(var(--bege))}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:1rem 0;font-weight:700;font-size:.875rem;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"⌄";font-size:1.25rem;line-height:1;transition:transform .2s;flex-shrink:0}
.faq[open] summary:after{transform:rotate(180deg)}
.faq .a{font-size:.875rem;color:hsl(var(--muted-foreground));padding-bottom:1rem}
</style>
</head>

      <button id="volver" type="button" aria-label="Volver">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img id="hdlogo" alt="El Secreto de la Insulina">
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="pbar" style="width:0%"></div></div>
  </div>
  <div id="sc"></div>
</div>

<script>
(function(){
"use strict";

/* ═══ 1. imágenes: data URI → blob (se decodifican una sola vez) ═══ */
var IMGRAW = {};
(function(){
  var C = CONFIG.IMG, k;
  for (k in C) if (C.hasOwnProperty(k)) IMGRAW[k] = C[k];
  for (k in C) {
    if (!C.hasOwnProperty(k)) continue;
    var v = C[k];
    if (typeof v !== "string" || v.indexOf("data:") !== 0) continue;
    try {
      var coma = v.indexOf(","), tipo = v.slice(5, v.indexOf(";")), bin = atob(v.slice(coma + 1));
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      C[k] = URL.createObjectURL(new Blob([arr], {type: tipo}));
    } catch (e) {}
  }
})();
window.__pre = []; window.__preTotal = 0;
(function(){
  for (var k in CONFIG.IMG) {
    if (!CONFIG.IMG.hasOwnProperty(k)) continue;

  h += '<div class="caja"><div class="hd"><div class="k">Tu Plan Exclusivo</div>' +
       '<div class="v">21 Días de Tratamiento</div></div><div style="padding:1rem;display:flex;flex-direction:column;gap:.75rem">';
  for (i = 0; i < plan.length; i++)
    h += '<div class="dia"><span style="font-size:1.5rem">' + plan[i].i + '</span>' +
      '<div style="flex:1"><div class="k">' + plan[i].d + '</div><div class="v">' + plan[i].t + '</div></div>' +
      (plan[i].meta ? '<span class="meta-tag">META</span>' : '') + '</div>';
  h += '<div style="background:hsl(var(--btn-green)/.1);color:hsl(var(--btn-green));text-align:center;' +
       'padding:.5rem;border-radius:.5rem;font-size:.875rem;font-weight:700;margin-top:.25rem">' +
       '🎯 Resultado esperado: hasta -' + proy + 'kg en 21 días</div></div></div>';

  h += '<div style="text-align:center"><h2 style="font-size:1rem;font-weight:700;margin:0">Además te llevás ' +
       '<span style="color:hsl(var(--coral))">3 bonos</span> para acelerar tus resultados</h2></div>';

  h += '<div class="col g3">';
  for (i = 0; i < bonos.length; i++)
    h += '<div class="bono"><span style="font-size:1.5rem;flex-shrink:0">🎁</span><div>' +
      '<div style="font-weight:700;font-size:.875rem">' + bonos[i].t + '</div>' +
      '<div style="font-size:.75rem;margin-top:.25rem" class="muted">' + bonos[i].d + '</div></div></div>';
  h += '</div>';

  h += '<div class="caja"><div class="hd"><div class="k">Mirá</div>' +
       '<div class="v" style="font-size:1rem">Todo a lo que vas a tener acceso garantizado</div>' +
       '<div style="font-size:.75rem;margin-top:.5rem;opacity:.9">Hasta el ' + fecha + '</div></div>' +
       '<div style="padding:1rem;display:flex;flex-direction:column;gap:.5rem">';
  for (i = 0; i < incluye.length; i++)
    h += '<div class="inc"><span style="color:hsl(var(--btn-green));flex-shrink:0">' +
      (incluye[i].b ? "🎁" : "✅") + '</span><span>' + incluye[i].t + '</span></div>';
  h += '<div class="precio" data-cta><div class="tach">TODO ESTO DE $' + P.PRECIO_TACHADO + '</div>' +
       '<div class="por">POR SOLO</div><div class="hoy">$' + P.PRECIO + '</div>' +
       '<div class="cuo">pesos (ARS) · o ' + P.CUOTAS + ' cuotas de $' + P.CUOTA + ' con Mercado Pago</div>' +
       '</div></div></div>';

  h += cta("QUIERO EMPEZAR 🥰");

  h += '<div class="gar"><div class="sello">GARANTÍA<br>30<br>DÍAS</div>' +
    '<div style="font-weight:700;font-size:1rem">Garantía de reembolso</div>' +
    '<p class="sub" style="margin-top:.5rem">Todo producto está obligado a dar como mínimo 7 días de garantía, ' +
      'pero confiamos tanto en la fórmula que te damos 30 días corridos.</p>' +
    '<p class="sub" style="margin-top:.5rem">O sea que si no te gusta o no te funciona, te devolvemos cada peso ' +
      'que pagaste, sin preguntar.</p></div>';

  h += '<div><h3 style="font-size:1.125rem;font-weight:700;text-align:center;margin:0 0 .75rem">❓ Preguntas frecuentes</h3>';
  for (i = 0; i < FAQS.length; i++)
    h += '<details class="faq"><summary>' + FAQS[i].q + '</summary><div class="a">' + FAQS[i].a + '</div></details>';
  h += '</div>';

  h += cta("¡QUIERO EMPEZAR AHORA! 🔥");
  h += '<div style="text-align:center;font-size:.75rem;padding:1rem 0" class="muted">🔒 Pago 100% seguro · Tus datos están protegidos</div>';
  h += '</div>';
  return '<div style="display:flex;flex-direction:column">' + h + '</div>';
}});

/* ═══ 6. motor ════════════════════════════════════════════ */
var estado = { i: 0 };
var TIMERS = [], IVS = [];
function temporizador(t){ TIMERS.push(t); return t; }
function intervalo(t){ IVS.push(t); return t; }
function limpiar(){
  for (var i = 0; i < TIMERS.length; i++) clearTimeout(TIMERS[i]);
  for (i = 0; i < IVS.length; i++) clearInterval(IVS[i]);
  TIMERS = []; IVS = [];
}

var sc = document.getElementById("sc");
var hd = document.getElementById("hd");
var pbar = document.getElementById("pbar");
document.getElementById("hdlogo").src = CONFIG.IMG.logo;

function ir(i){
  limpiar();
  if (i < 0) i = 0;
  if (i >= PASOS.length) i = PASOS.length - 1;
  estado.i = i;
  var paso = PASOS[i];
  sc.innerHTML = paso.render();
  sc.scrollTop = 0;
  /* el encabezado va en los pasos 2 a 28, igual que el original */
  if (i > 0){ hd.classList.add("on"); pbar.style.width = (i / (PASOS.length)) * 100 + "%"; }
  else { hd.classList.remove("on"); pbar.style.width = "0%"; }
  ligarCTAs();
  if (paso.despues) paso.despues();
  try { if (i === PASOS.length - 1) fbq("track", "ViewContent"); } catch(e){}
}

/* clics */
sc.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  var paso = PASOS[estado.i];

  if (act === "checkout"){
    try { fbq("track", "AddToCart"); } catch(e){}
    return;   /* es un <a>: el href ya está puesto por ligarCTAs */
  }
  if (act === "next"){ if (!el.disabled) ir(estado.i + 1); return; }
  if (act === "choose"){
    E[el.getAttribute("data-campo")] = el.getAttribute("data-v");
    var hs = sc.querySelectorAll('[data-act="choose"]');
    for (var j = 0; j < hs.length; j++) hs[j].classList.remove("selected");
    el.classList.add("selected");
    temporizador(setTimeout(function(){ ir(estado.i + 1); }, 300));
    return;
  }
  if (act === "toggle"){
    var campo = el.getAttribute("data-campo"), v = el.getAttribute("data-v");
    var arr = E[campo], p = arr.indexOf(v);
    if (p > -1) arr.splice(p, 1); else arr.push(v);
    el.classList.toggle("selected");
    var b = sc.querySelector('[data-act="next"]');
    if (b) b.disabled = arr.length === 0;
    return;
  }
  if (act === "delta"){
    var d = parseInt(el.getAttribute("data-d"), 10);
    var c = paso.campo, min = paso.min, max = paso.max;
    if (c === "pesoDeseado") max = E.peso - 1;
    E[c] = Math.max(min, Math.min(max, E[c] + d));
    if (E.pesoDeseado > E.peso - 1) E.pesoDeseado = Math.max(40, E.peso - 1);
    var big = sc.querySelector(".big");
    if (big) big.innerHTML = E[c] + '<span>' + (c === "altura" ? "cm" : "kg") + '</span>';
    if (c === "pesoDeseado"){
      var pill = sc.querySelector(".meta-pill"), dif = E.peso - E.pesoDeseado;
      if (pill) { if (dif > 0) pill.textContent = "Meta: bajar " + dif + " kg 🎯"; else pill.remove(); }
    }
    return;
  }
});

document.getElementById("volver").addEventListener("click", function(){
  if (estado.i > 0) ir(estado.i - 1);
});

/* ═══ 7. CTAs al checkout — un solo lugar, idempotente ════ */
function ligarCTAs(){
  var sel = document.querySelectorAll("a.js-cta, [data-cta], [data-act=checkout]");
  for (var i = 0; i < sel.length; i++){
    var e = sel[i];
    if (e.getAttribute("data-ligado")) continue;
    e.setAttribute("data-ligado", "1");
    if (e.tagName === "A"){ e.setAttribute("href", checkoutHref()); e.setAttribute("rel", "noopener"); continue; }
    e.style.cursor = "pointer";
    e.addEventListener("click", function(){
      try { fbq("track", "AddToCart"); } catch(err){}
      window.location.href = checkoutHref();
    });
  }
}

/* ═══ 8. arranque — SIEMPRE en la portada ═════════════════ */
window.ir = ir; window.E = E; window.PASOS = PASOS; window.estado = estado;
var pedido = parseInt(param("paso"), 10);
ir(pedido >= 1 && pedido <= PASOS.length ? pedido - 1 : 0);

})();
</script>
